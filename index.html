/* Filters reset must not wipe progress any more — that is a separate, explicit action. */
function toggleMistakes() {
  if (!state.currentModule) return;
  state.filterMistakes = !state.filterMistakes;
  state.modulePhase = 'results';
  state.visibleCount = PAGE_SIZE;
  renderModuleBody();
  updateMistakesButton();
  updateBarVisibility();
  if (state.filterMistakes) announce(t('myMistakes'));
}

function resetProgress() {
  const m = state.currentModule;
  if (!m) return;
  const prefix = m.slug + '-';
  Object.keys(state.userAnswers).forEach(qid => { if (qid.indexOf(prefix) === 0) delete state.userAnswers[qid]; });
  Object.keys(state.checkedQuestions).forEach(qid => { if (qid.indexOf(prefix) === 0) delete state.checkedQuestions[qid]; });
  try { localStorage.removeItem(progressKey(m.slug)); } catch (e) {}
  state.filterMistakes = false;
  renderModuleBody(true);
  updateProgressUI();
  updateMistakesButton();
  showToast(`<b>${esc(t('progressCleared'))}</b>`);
}

/* ════════════ SOUND ════════════ */
/* Everything is synthesised — no audio files to download. The tap is a short
   band-passed noise burst (close to an iOS keyboard tick); the answer motifs are
   two short notes: rising = right, matching = partial, falling = wrong. */
/* Tap timbre: 'pop' (round, pitched — default), 'tick' (dry and very short),
   'tock' (lower, wooden). Audition them without touching the code:
   index.html?tap=tick  ·  index.html?tap=tock  ·  index.html?tap=pop */
const TAP_STYLES = ['pop', 'tick', 'tock'];
const TAP_STYLE = (() => {
  let v = null;
  try { v = new URLSearchParams(location.search).get('tap'); } catch (e) { /* very old browser */ }
  return TAP_STYLES.includes(v) ? v : 'pop';
})();
const SOUND_KEY = 'qcm-sound';
let audioCtx = null;
let clickNoise = null;

function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  try { audioCtx = new Ctx(); } catch (e) { return null; }
  return audioCtx;
}

function noiseBuffer(ctx) {
  if (clickNoise) return clickNoise;
  const len = Math.floor(ctx.sampleRate * 0.05);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  clickNoise = buf;
  return buf;
}

function tone(ctx, freq, at, dur, peak, type) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, at);
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(peak, at + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(at);
  osc.stop(at + dur + 0.02);
}

/* a sine that falls in pitch and dies quickly — the body of a tap */
function pluck(ctx, at, f0, f1, dur, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, at);
  osc.frequency.exponentialRampToValueAtTime(f1, at + dur);
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(peak, at + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(at);
  osc.stop(at + dur + 0.02);
}

/* a breath of low-passed noise — the contact edge, not the sound itself */
function noiseTick(ctx, at, cutoff, dur, peak) {
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = cutoff;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(peak, at + 0.003);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  src.connect(lp).connect(gain).connect(ctx.destination);
  src.start(at);
  src.stop(at + dur + 0.02);
}

function playClick() {
  if (!state.sound) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const t = ctx.currentTime;

  if (TAP_STYLE === 'tick') {
    /* dry, almost inaudible pitch — closest to a keyboard */
    tone(ctx, 1700, t, 0.018, 0.07);
    return;
  }
  if (TAP_STYLE === 'tock') {
    /* lower and woodier */
    pluck(ctx, t, 300, 205, 0.07, 0.13);
    noiseTick(ctx, t, 700, 0.04, 0.05);
    return;
  }
  /* default: a soft round pop */
  pluck(ctx, t, 640, 430, 0.055, 0.12);
  noiseTick(ctx, t, 1200, 0.03, 0.035);
}

function playResult(kind) {
  if (!state.sound) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const t = ctx.currentTime + 0.01;
  if (kind === 'correct') {
    tone(ctx, 660, t, 0.13, 0.12);
    tone(ctx, 990, t + 0.09, 0.2, 0.1);
  } else if (kind === 'partial') {
    tone(ctx, 560, t, 0.15, 0.1, 'triangle');
    tone(ctx, 560, t + 0.12, 0.15, 0.08, 'triangle');
  } else {
    tone(ctx, 300, t, 0.16, 0.11, 'triangle');
    tone(ctx, 190, t + 0.09, 0.24, 0.09, 'triangle');
  }
}

function syncSoundButton() {
  const btn = $('sound-btn');
  if (!btn) return;
  btn.setAttribute('aria-pressed', String(!!state.sound));
  btn.setAttribute('aria-label', t('soundLabel'));
  btn.title = t('soundLabel');
}

function toggleSound() {
  if (state.sound) {
    playClick();            // audible confirmation before going quiet
    state.sound = false;
  } else {
    state.sound = true;
    playClick();
  }
  try { localStorage.setItem(SOUND_KEY, state.sound ? 'on' : 'off'); } catch (e) {}
  syncSoundButton();
}

/* ════════════ THEME ════════════ */
const THEME_KEY = 'qcm-theme';
let activeThemeVT = null;

function syncThemeColor() {
  const meta = $('theme-color-meta');
  if (!meta) return;
  meta.setAttribute('content', document.documentElement.classList.contains('theme-dark') ? '#0a0611' : '#fbfbfd');
}

function toggleTheme(btn) {
  const apply = () => {
    const isDark = document.documentElement.classList.contains('theme-dark');
    document.documentElement.classList.toggle('theme-dark', !isDark);
    try { localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark'); } catch(e) {}
    syncThemeColor();
  };
  const canVT = typeof document.startViewTransition === 'function'
    && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (canVT) {
    if (btn) {
      const r = btn.getBoundingClientRect();
      const x = r.left + r.width / 2;
      const y = r.top  + r.height / 2;
      const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.documentElement.style.setProperty('--vt-x', x + 'px');
      document.documentElement.style.setProperty('--vt-y', y + 'px');
      document.documentElement.style.setProperty('--vt-r', R + 'px');
    }
    if (activeThemeVT) { try { activeThemeVT.skipTransition(); } catch(e) {} }
    try {
      const vt = document.startViewTransition(apply);
      activeThemeVT = vt;
      vt.ready.catch(() => {});
      vt.finished.catch(() => {}).finally(() => { if (activeThemeVT === vt) activeThemeVT = null; });
    } catch (e) {
      apply();
      activeThemeVT = null;
    }
  } else {
    apply();
  }
}

/* ════════════ SEARCH CLEAR ════════════ */
function syncSearchClear() {
  const btn = $('search-clear');
  const input = $('f-search');
  if (!btn || !input) return;
  btn.hidden = input.value.length === 0;
}

function clearSearch() {
  const input = $('f-search');
  if (!input) return;
  input.value = '';
  state.filterSearch = '';
  syncSearchClear();
  onFilterChange();
  input.focus();
}

/* ════════════ PERMALINKS ════════════ */
function questionByQid(qid) {
  const data = currentModuleData();
  if (!data || !state.currentModule) return null;
  const slug = state.currentModule.slug;
  return data.questions.find(q => qidFor(slug, q) === qid) || null;
}

function questionPermalink(q) {
  const base = (location.origin && location.origin !== 'null')
    ? location.origin + location.pathname
    : location.href.split('#')[0];
  return base + '#module=' + encodeURIComponent(state.currentModule.slug)
    + '&q=' + encodeURIComponent(q._key);
}

function legacyCopy(text) {
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (ok) resolve();
      else reject(new Error('copy command refused'));
    } catch (e) { reject(e); }
  });
}

function copyToClipboard(text) {
  /* A present but rejecting clipboard API (permissions, insecure context) falls
     back to the old command instead of just failing. */
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
  }
  return legacyCopy(text);
}

function copyQuestionLink(qid) {
  const q = questionByQid(qid);
  if (!q) return;
  const url = questionPermalink(q);
  copyToClipboard(url).then(
    () => showToast(`<b>${esc(t('linkCopied'))}</b>`),
    () => showToast(`<b>${esc(url)}</b>`)
  );
}

/* Formatted report: module, exam, course, stem and (optionally) the permalink. */
function questionReport(q, withLink) {
  const m = state.currentModule;
  const name = (m.name && (m.name[state.lang] || m.name.fr)) || m.slug;
  const showRot = shouldShowRotation(state.selectedYear, m.slug);
  const lines = [
    'QCMify · erreur signalée',
    'Module : ' + name + ' (' + m.slug + ')',
    'Examen : ' + q.year + (showRot ? ' · ' + rotName(q.rot || 0) : ''),
    'Cours : ' + q.lesson
  ];
  if (q.unit) lines.push('Appareil : ' + q.unit);
  lines.push('Question : « ' + stripTags(q.text).trim().replace(/\s+/g, ' ') + ' »');
  if (withLink !== false) lines.push('Lien : ' + questionPermalink(q));
  return lines.join('\n');
}

/* Opens the chat with the report already in the composer, permalink included. */
function reportUrl(q) {
  return REPORT_CHAT + '?text=' + encodeURIComponent(questionReport(q, true));
}

/* Deep link #module=x&q=<key>: reveal the page that holds it and highlight it. */
function focusQuestion(key) {
  const data = currentModuleData();
  if (!data) return;
  state.modulePhase = 'results';
  const list = getFilteredQuestions();
  const pos = list.findIndex(q => q._key === key);
  if (pos === -1) return;
  state.visibleCount = Math.max(PAGE_SIZE, pos + 1);
  renderModuleBody(true);
  requestAnimationFrame(() => {
    const qid = state.currentModule.slug + '-' + key;
    const card = document.querySelector(`.q-card[data-qid="${CSS.escape(qid)}"]`);
    if (!card) return;
    card.classList.add('q-focus');
    card.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' });
  });
}

/* ════════════ KEYBOARD ════════════ */
function moveCardFocus(dir) {
  const cards = [...document.querySelectorAll('.q-card')];
  if (!cards.length) return;
  const idx = cards.findIndex(c => c.dataset.qid === lastCardQid);
  const next = Math.max(0, Math.min(cards.length - 1, (idx === -1 ? 0 : idx + dir)));
  const card = cards[next];
  lastCardQid = card.dataset.qid;
  card.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' });
  const first = card.querySelector('.opt:not(:disabled)');
  if (first) first.focus({ preventScroll: true });
}

/* ════════════ EXAM MODE (randomised timed set) ════════════ */
let examTicker = null;

function setExamActiveUI(active) {
  const controls = $('controls');
  if (controls) controls.classList.toggle('exam-active', active);
  if ($('exam-setup')) $('exam-setup').hidden = active;
  if ($('exam-live')) $('exam-live').hidden = !active;
  if ($('exam-bar')) $('exam-bar').hidden = false;
  const btn = $('btn-exam');
  if (btn) btn.setAttribute('aria-expanded', String(active));
}

function renderExamControls() {
  const countSel = $('exam-count');
  const timeSel = $('exam-time');
  if (!countSel || !timeSel) return;
  $('exam-count-label').textContent = t('examCount');
  $('exam-time-label').textContent = t('examTime');
  $('exam-start').textContent = t('examStart');
  $('exam-finish').textContent = t('examFinish');
  $('btn-exam').textContent = t('examMode');
  [...countSel.options].forEach(o => { if (o.value === '0') o.textContent = t('examAll'); });
  [...timeSel.options].forEach(o => { if (o.value === '0') o.textContent = t('examNone'); });
}

function toggleExamSetup() {
  if (state.exam) return;
  const bar = $('exam-bar');
  const open = bar.hidden;
  bar.hidden = !open;
  $('btn-exam').setAttribute('aria-expanded', String(open));
}

function examAnsweredCount() {
  if (!state.exam || !state.currentModule) return 0;
  const data = currentModuleData();
  if (!data) return 0;
  const slug = state.currentModule.slug;
  let n = 0;
  state.exam.rows.forEach(idx => {
    const q = data.questions[idx];
    if (q && state.checkedQuestions[slug + '-' + q._key]) n++;
  });
  return n;
}

function updateExamUI() {
  const ex = state.exam;
  if (!ex) return;
  if ($('exam-progress')) $('exam-progress').textContent = t('examProgress')(examAnsweredCount(), ex.total);
  const clock = $('exam-clock');
  if (!clock) return;
  if (!ex.deadline || ex.finished) { clock.hidden = true; return; }
  const left = Math.max(0, ex.deadline - Date.now());
  const mm = String(Math.floor(left / 60000)).padStart(2, '0');
  const ss = String(Math.floor((left % 60000) / 1000)).padStart(2, '0');
  clock.hidden = false;
  clock.textContent = mm + ':' + ss;
  clock.classList.toggle('low', left <= 60000);
}

function startExam() {
  const data = currentModuleData();
  if (!data) return;
  /* draw from the filtered pool, ignoring the exam currently on screen.
     Rows are de-duplicated by content first: a question asked in three sessions
     must not eat three slots of a 20-question exam. */
  const previousExam = state.exam;
  state.exam = null;
  const drawnKeys = new Set();
  const pool = getFilteredQuestions().filter(q => {
    if (drawnKeys.has(q._key)) return false;
    drawnKeys.add(q._key);
    return true;
  });
  state.exam = previousExam;
  if (!pool.length) { showToast(`<b>${esc(t('examEmpty'))}</b>`); return; }

  const count = Number($('exam-count').value) || 0;
  const minutes = Number($('exam-time').value) || 0;
  const shuffled = pool.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const picked = count > 0 ? shuffled.slice(0, count) : shuffled;

  const rows = new Set(), order = new Map(), snapshot = new Map();
  picked.forEach((q, i) => {
    rows.add(q._idx);
    order.set(q._idx, i);
    const qid = qidFor(state.currentModule.slug, q);
    /* remember the previous state, so an abandoned attempt can be undone */
    snapshot.set(qid, {
      answers: state.userAnswers[qid] ? new Set(state.userAnswers[qid]) : null,
      checked: !!state.checkedQuestions[qid]
    });
    delete state.checkedQuestions[qid];     // a fresh attempt
    delete state.userAnswers[qid];
  });

  state.exam = {
    slug: state.currentModule.slug, rows, order, snapshot,
    total: picked.length, deadline: minutes ? Date.now() + minutes * 60000 : 0, finished: false
  };
  state.modulePhase = 'results';
  state.filterMistakes = false;
  state.visibleCount = picked.length;
  $('exam-summary').hidden = true;
  $('exam-summary').innerHTML = '';
  $('exam-finish').hidden = false;
  setExamActiveUI(true);
  renderModuleBody(true);
  updateProgressUI();
  updateMistakesButton();
  updateExamUI();
  window.scrollTo({ top: 0, behavior: smoothBehavior() });
  clearInterval(examTicker);
  examTicker = setInterval(() => {
    if (!state.exam) { clearInterval(examTicker); examTicker = null; return; }
    if (state.exam.finished) return;
    updateExamUI();
    if (state.exam.deadline && Date.now() >= state.exam.deadline) finishExam(true);
  }, 1000);
}

function finishExam(auto) {
  const ex = state.exam;
  const data = currentModuleData();
  if (!ex || !data) return;
  clearInterval(examTicker);
  examTicker = null;
  const slug = state.currentModule.slug;
  let correct = 0, partial = 0, wrong = 0, answered = 0;
  ex.rows.forEach(idx => {
    const q = data.questions[idx];
    if (!q) return;
    const qid = slug + '-' + q._key;
    if (!state.checkedQuestions[qid]) return;
    answered++;
    const verdict = classifyAnswer(state.userAnswers[qid], q.answer.split(''));
    if (verdict === 'correct') correct++;
    else if (verdict === 'partial') partial++;
    else wrong++;
  });
  ex.finished = true;
  ex.result = { correct, partial, wrong, answered };

  const summary = $('exam-summary');
  summary.hidden = false;
  summary.innerHTML = `
    <h2>${esc(auto ? t('examTimeUp') : t('examDone'))}</h2>
    <p><b>${correct}</b>/${ex.total} ${esc(t('examScoreLabel'))} · ${answered}/${ex.total} ${esc(t('examAnswered'))}
      ${partial ? ' · ' + partial + ' ' + esc(t('partial')) : ''}</p>
    <div class="exam-actions">
      <button class="btn btn-primary" type="button" data-action="exam-again">${esc(t('examAgain'))}</button>
      <button class="btn btn-secondary" type="button" data-action="exam-quit">${esc(t('examQuit'))}</button>
      <button class="btn btn-secondary" type="button" data-action="exam-mistakes">${esc(t('myMistakes'))}</button>
    </div>`;
  if ($('exam-finish')) $('exam-finish').hidden = true;
  if ($('exam-clock')) $('exam-clock').hidden = true;
  if ($('exam-progress')) $('exam-progress').textContent = `${correct}/${ex.total} · ${t('examDone')}`;
  updateProgressUI();
  updateMistakesButton();
  summary.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
}

function clearExamState() {
  const ex = state.exam;
  /* an abandoned (never finished) attempt gives the previous answers back */
  if (ex && !ex.finished && ex.snapshot) {
    ex.snapshot.forEach((prev, qid) => {
      if (prev.answers) state.userAnswers[qid] = prev.answers;
      else delete state.userAnswers[qid];
      if (prev.checked) state.checkedQuestions[qid] = true;
      else delete state.checkedQuestions[qid];
    });
    /* explicit slug: the route may already point at another module by now */
    persistProgress(ex.slug, MODULE_DATA[ex.slug]);
  }
  clearInterval(examTicker);
  examTicker = null;
  state.exam = null;
  const summary = $('exam-summary');
  if (summary) { summary.hidden = true; summary.innerHTML = ''; }
  if ($('exam-finish')) $('exam-finish').hidden = false;
  setExamActiveUI(false);
  if ($('exam-bar')) $('exam-bar').hidden = true;
}

function quitExam() {
  clearExamState();
  state.visibleCount = PAGE_SIZE;
  renderModuleBody(true);
  updateProgressUI();
  updateMistakesButton();
}

/* ════════════ EVENTS ════════════ */
/* One tick per tap on an interactive element (capture, so it fires before any
   handler can stop propagation). Empty space stays silent: a stray click should
   not make noise. The validate button is skipped — it gets the answer motif instead. */
document.addEventListener('click', (e) => {
  if (!state.sound) return;
  if (!e.target || !e.target.closest) return;
  if (e.target.closest('[data-validate-qid]') || e.target.closest('#sound-btn')) return;
  if (!e.target.closest('button, a, label, select, input, [role="button"], summary')) return;
  playClick();
}, true);

document.addEventListener('click', (e) => {
  const toastEl = e.target.closest('#toast.actionable');
  if (toastEl) { runToastAction(); return; }
  const cardHit = e.target.closest('.q-card');
  if (cardHit && cardHit.dataset.qid) lastCardQid = cardHit.dataset.qid;
  if (!e.target.closest('.multiselect')) closeAllPanels();
  const langBtn = e.target.closest('[data-lang]');
  if (langBtn) { setLang(langBtn.dataset.lang); return; }

  const themeBtn = e.target.closest('#theme-btn');
  if (themeBtn) { toggleTheme(themeBtn); return; }

  if (e.target.closest('#sound-btn')) { toggleSound(); return; }

  if (e.target.closest('#search-clear')) { clearSearch(); return; }
  const linkBtn = e.target.closest('[data-link-qid]');
  if (linkBtn) { copyQuestionLink(linkBtn.dataset.linkQid); return; }

  if (e.target.closest('[data-action="home"]')) { goToYearGrid(); return; }
  if (e.target.closest('[data-action="back-from-module"]')) { goBackFromModule(); return; }
  if (e.target.closest('[data-action="reset-filters"]')) { resetFilters(); return; }
  if (e.target.closest('[data-action="toggle-mistakes"]')) { toggleMistakes(); return; }
  if (e.target.closest('[data-action="reset-progress"]')) { resetProgress(); return; }
  if (e.target.closest('[data-action="show-all"]')) { showAllQuestions(); return; }
  if (e.target.closest('[data-action="randomize"]')) { randomizeFilters(); return; }
  if (e.target.closest('[data-action="toggle-exam"]')) { toggleExamSetup(); return; }
  if (e.target.closest('[data-action="exam-start"]')) { startExam(); return; }
  if (e.target.closest('[data-action="exam-finish"]')) { finishExam(false); return; }
  if (e.target.closest('[data-action="exam-quit"]')) { quitExam(); return; }
  if (e.target.closest('[data-action="exam-again"]')) { startExam(); return; }
  if (e.target.closest('[data-action="exam-mistakes"]')) { quitExam(); toggleMistakes(); return; }

  const yearCard = e.target.closest('[data-year]');
  if (yearCard) { selectYear(+yearCard.dataset.year); return; }
  const semCard = e.target.closest('[data-semester]');
  if (semCard) { selectSemester(+semCard.dataset.semester); return; }

  const modCard = e.target.closest('[data-module-slug]');
  if (modCard) {
    if (modCard.classList.contains('coming-soon')) {
      showToast(`<b>${t('comingSoonToast')}</b> — ${esc(modCard.dataset.moduleName)}`);
      return;
    }
    window.location.hash = 'module=' + modCard.dataset.moduleSlug;
    return;
  }

  const opt = e.target.closest('[data-opt-qid]');
  if (opt && !opt.disabled) {
    const qid = opt.dataset.optQid;
    const letter = opt.dataset.letter;
    if (state.checkedQuestions[qid]) return;
    if (!state.userAnswers[qid]) state.userAnswers[qid] = new Set();
    if (state.userAnswers[qid].has(letter)) state.userAnswers[qid].delete(letter);
    else state.userAnswers[qid].add(letter);
    lastCardQid = qid;
    updateSelectionUI(qid);
    schedulePersist();
    return;
  }
  const v = e.target.closest('[data-validate-qid]');
  if (v && !v.disabled) {
    const qid = v.dataset.validateQid;
    if (state.userAnswers[qid] && state.userAnswers[qid].size > 0) {
      state.checkedQuestions[qid] = true;
      afterAnswerChange(qid);
      announceResult(qid);
      const q = questionByQid(qid);
      if (q) playResult(classifyAnswer(state.userAnswers[qid], q.answer.split('')));
    }
    return;
  }
  const c = e.target.closest('[data-clear-qid]');
  if (c) {
    const qid = c.dataset.clearQid;
    state.userAnswers[qid] = new Set();
    delete state.checkedQuestions[qid];
    afterAnswerChange(qid);
    return;
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'sort-year') { state.sortYear = e.target.value; onFilterChange(); }
});

let searchTimeout;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'f-search') return;
  syncSearchClear();
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    state.filterSearch = e.target.value;
    onFilterChange();
  }, 150);
});

document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if (e.key === 'Escape') {
    const openPanel = document.querySelector('.ms-panel.open');
    const trigger = openPanel && openPanel.closest('.multiselect')?.querySelector('.ms-trigger');
    closeAllPanels();
    /* do not strand keyboard focus inside a panel that just closed */
    if (openPanel && trigger) trigger.focus();
    else if (active && active.id === 'f-search' && active.value) clearSearch();
    return;
  }
  const toast = $('toast');
  if (toast && toast.classList.contains('actionable') && active === toast
      && (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar')) {
    e.preventDefault();
    runToastAction();
    return;
  }

  /* shortcuts: 1–5 pick an option, Enter validates, j/k jump between questions */
  if (!state.currentModule || state.modulePhase !== 'results') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (/^[1-5]$/.test(e.key)) {
    if (!lastCardQid || state.checkedQuestions[lastCardQid]) return;
    const card = document.querySelector(`.q-card[data-qid="${CSS.escape(lastCardQid)}"]`);
    const btn = card && card.querySelector(`[data-letter="${'ABCDE'[Number(e.key) - 1]}"]`);
    if (!btn || btn.disabled) return;
    e.preventDefault();
    btn.click();
    return;
  }
  if (e.key === 'Enter') {
    if (tag === 'button' || tag === 'a') return;   // native activation
    if (!lastCardQid) return;
    const card = document.querySelector(`.q-card[data-qid="${CSS.escape(lastCardQid)}"]`);
    const v = card && card.querySelector('[data-validate-qid]');
    if (v && !v.disabled) { e.preventDefault(); v.click(); }
    return;
  }
  if (e.key === 'j' || e.key === 'k') {
    e.preventDefault();
    moveCardFocus(e.key === 'j' ? 1 : -1);
  }
});

document.addEventListener('focusin', (e) => {
  const card = e.target.closest && e.target.closest('.q-card');
  if (card && card.dataset.qid) lastCardQid = card.dataset.qid;
});

$('back-to-filters').addEventListener('click', () => {
  const ctrl = $('controls');
  if (!ctrl) return;
  const y = ctrl.getBoundingClientRect().top + window.scrollY - 16;
  window.scrollTo({ top: y, behavior: smoothBehavior() });
});

$('btn-load-more').addEventListener('click', () => {
  state.visibleCount += PAGE_SIZE;
  renderQuestions(false, true);
});

window.addEventListener('scroll', updateBarVisibility, { passive: true });

/* ════════════ OFFLINE (service worker) ════════════ */
function registerServiceWorker() {
  /* isSecureContext is true for https and for http://localhost/127.0.0.1,
     which is where the e2e suite and local previews run. */
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      /* The worker serves the shell network-first, so a new build is already in
         place on the next load — no forced reload here (that would just reload a
         page that is already up to date). The toast is an optional nudge. */
      reg.addEventListener('updatefound', () => {
        const next = reg.installing;
        if (!next) return;
        next.addEventListener('statechange', () => {
          if (next.state === 'installed' && navigator.serviceWorker.controller) {
            showToast(`<b>${esc(t('updateReady'))}</b>`, () => window.location.reload());
          }
        });
      });
    }).catch(() => {});
  });
}

/* ════════════ INIT ════════════ */
function runRoute() {
  if (suppressHashRoute) { suppressHashRoute = false; return Promise.resolve(); }
  return applyRoute().catch(err => console.error('[QCMify] route error', err));
}
window.addEventListener('hashchange', runRoute);
renderChrome();
syncThemeColor();
$('footer-version').textContent = 'v' + APP_VERSION;   // support: "which build do you see?"
runRoute();
registerServiceWorker();

if (DEBUG) console.info('[QCMify] v' + APP_VERSION + ' · data source: ' + DATA_BASE);
</script>
