<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="QCMify · Banque de QCM médicaux">
<title>QCMify · Banque de QCM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2334c759' rx='20'/><text x='50' y='60' font-family='Arial,sans-serif' font-weight='900' font-size='42' fill='white' text-anchor='middle' letter-spacing='-2'>Q</text></svg>">
<script>(function(){try{if(localStorage.getItem('qcm-theme')==='dark')document.documentElement.classList.add('theme-dark');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fbfbfd;--bg-2:#f5f5f7;--card:#fff;
  --text:#1d1d1f;--text-2:#6e6e73;--text-3:#86868b;--text-4:#a1a1a6;
  --border:rgba(0,0,0,.07);--border-2:rgba(0,0,0,.12);
  --accent:#34c759;--accent-hover:#28a745;--accent-soft:rgba(52,199,89,.08);
  --success:#34c759;--success-soft:rgba(52,199,89,.09);--success-border:rgba(52,199,89,.3);
  --danger:#ff3b30;--danger-soft:rgba(255,59,48,.08);--danger-border:rgba(255,59,48,.3);
  --warning:#ff9500;--warning-soft:rgba(255,149,0,.10);--warning-border:rgba(255,149,0,.30);
  --shadow-sm:0 1px 2px rgba(0,0,0,.03);
  --shadow-md:0 2px 8px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.03);
  --shadow-lg:0 12px 32px rgba(0,0,0,.08);
  --radius-sm:10px;--radius:16px;--radius-lg:20px;--radius-pill:980px;
  --ease:cubic-bezier(.25,.1,.25,1);--ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
  --icon-calendar-down: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386868b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/><path d='M9 14l3 3 3-3'/></svg>");
  --icon-calendar-up:   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386868b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/><path d='M9 17l3-3 3 3'/></svg>");
  --icon-sort-az:       url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386868b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 16l4 4 4-4'/><path d='M7 20V4'/><path d='M11 4h4'/><path d='M11 8h7'/><path d='M11 12h10'/></svg>");
  --icon-sort-za:       url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386868b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 8l4-4 4 4'/><path d='M7 4v16'/><path d='M11 12h10'/><path d='M11 16h7'/><path d='M11 20h4'/></svg>");
}
html.theme-dark{
  --bg:#0a0611;--bg-2:#120a1e;--card:#180e26;
  --text:#f5f0ff;--text-2:#c9bce0;--text-3:#9184a8;--text-4:#5f5273;
  --border:rgba(168,85,247,.14);--border-2:rgba(168,85,247,.32);
  --accent:#a855f7;--accent-hover:#c084fc;--accent-soft:rgba(147,51,234,.14);
  --success:#22d3ee;--success-soft:rgba(34,211,238,.10);--success-border:rgba(34,211,238,.42);
  --danger:#ec4899;--danger-soft:rgba(236,72,153,.14);--danger-border:rgba(236,72,153,.42);
  --warning:#fbbf24;--warning-soft:rgba(251,191,36,.12);--warning-border:rgba(251,191,36,.40);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 8px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
  color-scheme:dark;
  --icon-calendar-down: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239184a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/><path d='M9 14l3 3 3-3'/></svg>");
  --icon-calendar-up:   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239184a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/><path d='M9 17l3-3 3 3'/></svg>");
  --icon-sort-az:       url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239184a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 16l4 4 4-4'/><path d='M7 20V4'/><path d='M11 4h4'/><path d='M11 8h7'/><path d='M11 12h10'/></svg>");
  --icon-sort-za:       url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239184a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 8l4-4 4 4'/><path d='M7 4v16'/><path d='M11 12h10'/><path d='M11 16h7'/><path d='M11 20h4'/></svg>");
}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;background:var(--bg);transition:background-color .2s var(--ease)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;letter-spacing:-.011em;min-height:100vh;background-image:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(52,199,89,.04),transparent 60%),radial-gradient(ellipse 50% 40% at 90% 20%,rgba(255,149,0,.03),transparent 50%);background-attachment:fixed;transition:background-color .2s var(--ease),color .2s var(--ease)}
html.theme-dark body{background-image:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(147,51,234,.16),transparent 60%),radial-gradient(ellipse 50% 40% at 90% 20%,rgba(236,72,153,.08),transparent 55%)}

::view-transition-old(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){mix-blend-mode:normal;animation:theme-circle 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;will-change:clip-path}
@keyframes theme-circle{from{clip-path:circle(0px at var(--vt-x, 50vw) var(--vt-y, 0px))}to{clip-path:circle(var(--vt-r, 150vmax) at var(--vt-x, 50vw) var(--vt-y, 0px))}}
@media (prefers-reduced-motion: reduce){::view-transition-old(root),::view-transition-new(root){animation-duration:0.001ms !important}html, body{transition-duration:0.001ms !important}}

.container{max-width:1080px;margin:0 auto;padding:0 24px}
svg{display:block}
button{font-family:inherit}

.site-header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--border)}
@supports not (background:color-mix(in srgb,red,blue)){.site-header{background:var(--bg)}}
.site-header .container{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);cursor:pointer;background:none;border:none;padding:0}
.logo-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),#20b2aa);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo-text{font-weight:600;font-size:16px;letter-spacing:-.02em}
.header-right{display:flex;align-items:center;gap:8px}
.lang-toggle{display:inline-flex;background:rgba(0,0,0,.05);border-radius:var(--radius-pill);padding:3px;gap:2px}
html.theme-dark .lang-toggle{background:rgba(255,255,255,.06)}
.lang-toggle button{padding:5px 12px;background:transparent;border:none;border-radius:var(--radius-pill);font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all .2s var(--ease);letter-spacing:.02em}
.lang-toggle button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}
.theme-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:50%;color:var(--text-2);cursor:pointer;transition:all .2s var(--ease)}
.theme-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}
html.theme-dark .theme-btn:hover{background:rgba(255,255,255,.06)}
.theme-btn svg{width:16px;height:16px}
.theme-btn .sun{display:none}
html.theme-dark .theme-btn .sun{display:block}
html.theme-dark .theme-btn .moon{display:none}

.hero{padding:56px 0 40px;text-align:center}
.hero h1{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-bottom:12px}
.hero h1 span{background:linear-gradient(135deg,var(--accent),#20b2aa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html.theme-dark .hero h1 span{background:linear-gradient(135deg,#c084fc,#9333ea 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:1rem;color:var(--text-2);max-width:560px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:var(--accent-soft);color:var(--accent);border-radius:var(--radius-pill);font-size:12px;font-weight:600;margin-bottom:18px}
.eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

.section{padding:20px 0 40px}
#semester-section, #modules-section { scroll-margin-top: 80px; }
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.section-head h2{font-size:clamp(1.25rem,2.4vw,1.55rem);font-weight:700;letter-spacing:-.03em;margin-bottom:3px}
.section-head p{font-size:14px;color:var(--text-2)}
.sub-header{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:12px;margin-top:4px}
.sub-header:not(:first-child){margin-top:28px;}

@keyframes cardIn { 
  from { opacity: 0; transform: translateY(24px) scale(0.98); } 
  to   { opacity: var(--final-opacity, 1); transform: translateY(0) scale(1); } 
}
.animate-in { animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }

.years-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.year-card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:left;transition:border-color .25s var(--ease),background-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);width:100%;color:var(--text)}
.year-card:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.year-card.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.year-big{font-size:2rem;font-weight:700;letter-spacing:-.04em;line-height:1;min-width:38px;font-variant-numeric:tabular-nums;color:var(--text)}
.year-card.active .year-big{color:var(--accent)}
.year-info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.year-label{font-size:14px;font-weight:600;letter-spacing:-.01em}
.year-count{font-size:11.5px;color:var(--text-3);font-weight:500}

.semester-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.semester-card{position:relative;padding:24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;text-align:left;transition:border-color .25s var(--ease),background-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);overflow:hidden;width:100%;color:var(--text)}
.semester-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-soft),transparent 60%);opacity:0;transition:opacity .3s var(--ease);pointer-events:none}
.semester-card:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.semester-card:hover::before,.semester-card.active::before{opacity:1}
.semester-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.semester-badge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--bg-2);border-radius:12px;font-weight:700;font-size:14px;margin-bottom:14px;position:relative}
.semester-card.active .semester-badge{background:var(--accent);color:#fff}
.semester-card h3{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;position:relative}
.semester-card p{font-size:13px;color:var(--text-3);font-weight:500;position:relative}

.modules-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:32px}
.modules-grid:last-child{margin-bottom:0}
.module-card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:left;transition:border-color .25s var(--ease),background-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease),opacity .3s var(--ease);width:100%;color:var(--text);order:0}
.module-card:hover:not(.coming-soon){border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.module-card.coming-soon{--final-opacity: 0.72; opacity: 0.72; cursor:help; order:1}
.module-card.coming-soon:hover{border-color:var(--border);transform:none;box-shadow:var(--shadow-sm)}
.module-icon{width:42px;height:42px;border-radius:11px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;transition:all .25s var(--ease)}
.module-card:hover:not(.coming-soon) .module-icon{background:var(--accent-soft);color:var(--accent)}
.module-icon svg{width:20px;height:20px}
.module-info{flex:1;min-width:0}
.module-info h3{font-size:14.5px;font-weight:600;letter-spacing:-.015em;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.module-info p{font-size:12px;color:var(--text-3);font-weight:500}
.badge-soon{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--warning-soft);color:var(--warning);border-radius:var(--radius-pill);font-size:10px;font-weight:600}
.badge-soon svg{width:9px;height:9px}
.module-arrow{width:16px;height:16px;color:var(--text-4);flex-shrink:0;transition:all .2s var(--ease)}
.module-card:hover:not(.coming-soon) .module-arrow{transform:translateX(3px);color:var(--accent)}
.module-card.coming-soon .module-arrow{opacity:.4}

.pending { opacity: 0 !important; pointer-events: none !important; }

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;letter-spacing:.01em;line-height:1.4}
.tag-year{background:var(--accent-soft);color:var(--accent)}
.tag-rot{background:var(--accent-soft);color:var(--accent)}
.tag-unit{background:var(--accent-soft);color:var(--accent);font-weight:500}
.tag-lesson{background:rgba(0,0,0,.05);color:var(--text-2);font-weight:500}
html.theme-dark .tag-lesson{background:rgba(255,255,255,.06)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:500;border:1px solid transparent;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.btn-secondary{background:rgba(0,0,0,.04);color:var(--text)}
.btn-secondary:hover{background:rgba(0,0,0,.07)}
html.theme-dark .btn-secondary{background:rgba(255,255,255,.06)}
html.theme-dark .btn-secondary:hover{background:rgba(255,255,255,.10)}

.module-hero{padding:28px 0 20px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;background:rgba(0,0,0,.04);border:none;border-radius:var(--radius-pill);font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;margin-bottom:18px;transition:all .2s var(--ease)}
html.theme-dark .back-btn{background:rgba(255,255,255,.06)}
.back-btn:hover{background:rgba(0,0,0,.07);color:var(--text)}
html.theme-dark .back-btn:hover{background:rgba(255,255,255,.10)}
.back-btn svg{width:14px;height:14px}
.module-header{display:flex;align-items:center;gap:16px}
.module-icon-lg{width:60px;height:60px;border-radius:15px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.module-icon-lg svg{width:28px;height:28px}
.module-header h1{font-size:clamp(1.5rem,2.8vw,2rem);font-weight:700;letter-spacing:-.03em;margin-bottom:3px}
.module-header p{font-size:13.5px;color:var(--text-2);font-weight:500}

.controls{position:relative;z-index:50;padding:12px 0 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;width:16px;height:16px}
.search-wrap input{width:100%;padding:10px 14px 10px 40px;background:rgba(0,0,0,.04);border:1px solid transparent;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:all .2s var(--ease)}
html.theme-dark .search-wrap input{background:rgba(255,255,255,.06)}
.search-wrap input:focus{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
html.theme-dark .search-wrap input:focus{background:var(--card)}
.search-wrap input::placeholder{color:var(--text-3)}

.filters-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.multiselect{position:relative;flex:1 1 160px;min-width:0}
.ms-trigger{width:100%;display:flex;align-items:center;position:relative;padding:10px 36px 10px 13px;background:rgba(0,0,0,.04);border:1px solid transparent;border-radius:var(--radius-sm);font-family:inherit;font-size:13.5px;font-weight:500;color:var(--text);cursor:pointer;transition:all .2s var(--ease);text-align:left}
html.theme-dark .ms-trigger{background:rgba(255,255,255,.06)}
.ms-trigger:hover{filter:brightness(0.97)}
.ms-trigger:focus-visible,.ms-trigger[aria-expanded="true"]{outline:none;background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
html.theme-dark .ms-trigger:focus-visible,html.theme-dark .ms-trigger[aria-expanded="true"]{background:var(--card)}
.ms-trigger.has-selection{color:var(--accent);font-weight:600}
.ms-label{flex:1;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;min-width:0}
.ms-trigger::after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--text-3);border-bottom:1.5px solid var(--text-3);transform:translateY(-65%) rotate(45deg);pointer-events:none;transition:transform .2s var(--ease),border-color .2s var(--ease)}
.ms-trigger[aria-expanded="true"]::after{border-color:var(--accent);transform:translateY(-35%) rotate(-135deg)}
.ms-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:230px;max-height:min(72vh, 460px);display:none;flex-direction:column;background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);z-index:100;animation:msIn .15s var(--ease-out)}
@keyframes msIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.ms-panel.open{display:flex}
.ms-actions{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.ms-actions button{flex:1;padding:5px 8px;background:rgba(0,0,0,.04);border:none;border-radius:6px;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--text-2);cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease)}

/* ════════════ LIVE DATA CACHE ════════════ */
const MODULE_DATA = {};

/* ════════════ UTILS ════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t = k => T[state.lang][k];
const LETTERS = ['A','B','C','D','E'];

function rotName(r) {
  const L = state.lang;
  if (r === 0) return L === 'fr' ? 'Rattrapage' : 'Make-up';
  if (r === 4) return 'Constantine';
  const suffix = r === 1 ? (L === 'fr' ? 'ère' : 'st') : (L === 'fr' ? 'ème' : 'th');
  return `${r}${suffix} Rotation`;
}

function questionId(slug, q, idx) {
  return `${slug}-${q.year}-${idx}`;
}

function moduleHasData(slug) {
  return !!MODULE_DATA[slug]
    && Array.isArray(MODULE_DATA[slug].questions)
    && MODULE_DATA[slug].questions.length > 0;
}

function sortLessons(arr) {
  return [...arr].sort((a, b) => {
    const aTd = /^(TD|Sim|TP)(?![a-zA-Z])/.test(a);
    const bTd = /^(TD|Sim|TP)(?![a-zA-Z])/.test(b);
    if (aTd !== bTd) return aTd ? 1 : -1;
    return a.localeCompare(b, 'fr', { sensitivity: 'base' });
  });
}

function sortByStatus(list) {
  return [...list].sort((a, b) => {
    const aMissing = moduleStatus(a.slug) === 'missing';
    const bMissing = moduleStatus(b.slug) === 'missing';
    return aMissing === bMissing ? 0 : (aMissing ? 1 : -1);
  });
}

/* ── external JSON loading ── */
const DATA_STATE = {};
const DATA_PROMISES = {};

function moduleStatus(slug) {
  if (moduleHasData(slug)) return 'ready';
  return DATA_STATE[slug] || 'unknown';
}

function normalizeModuleData(raw) {
  if (!raw || !Array.isArray(raw.questions)) throw new Error('missing "questions" array');
  const questions = raw.questions.map(q => ({
    year: +q.year,
    rot: q.rot == null ? 0 : +q.rot,
    unit: String(q.unit == null ? '' : q.unit).trim(),
    lesson: String(q.lesson == null ? '' : q.lesson).trim(),
    text: String(q.text == null ? '' : q.text),
    options: (q.options || []).map(o => String(o)),
    answer: String(q.answer || '').toUpperCase().replace(/[^A-Z]/g, '')
  })).filter(q =>
    q.text && q.options.length >= 2 && q.answer &&
    q.answer.split('').every(c => LETTERS.includes(c) && LETTERS.indexOf(c) < q.options.length)
  );
  if (!questions.length) throw new Error('no valid questions after normalisation');
  const lessons = (Array.isArray(raw.lessons) && raw.lessons.length)
    ? raw.lessons.map(String)
    : [...new Set(questions.map(q => q.lesson))];
  return { lessons, questions };
}

function loadModule(slug) {
  if (moduleHasData(slug)) return Promise.resolve();
  if (DATA_PROMISES[slug]) return DATA_PROMISES[slug];

  DATA_STATE[slug] = 'loading';
  DATA_PROMISES[slug] = fetch(DATA_BASE + slug + '.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(raw => {
      MODULE_DATA[slug] = normalizeModuleData(raw);
      DATA_STATE[slug] = 'ready';
      console.info('[QCMify] ' + slug + '.json loaded: '
        + MODULE_DATA[slug].questions.length + ' questions · '
        + MODULE_DATA[slug].lessons.length + ' lessons');
    })
    .catch(err => {
      DATA_STATE[slug] = 'missing';
      delete DATA_PROMISES[slug];
      console.warn('[QCMify] ' + slug + '.json unavailable — ' + err.message);
    });
  return DATA_PROMISES[slug];
}

function ensureModules(slugs) {
  return Promise.all([...new Set(slugs)].map(loadModule));
}

function allSlugsForYear(y) {
  const c = CURRICULUM[y];
  if (!c) return [];
  const out = [];
  if (c.semesters)    c.semesters.forEach(s => s.modules.forEach(m => out.push(m.slug)));
  if (c.otherModules) c.otherModules.forEach(m => out.push(m.slug));
  if (c.unities)      c.unities.forEach(m => out.push(m.slug));
  if (c.modules)      c.modules.forEach(m => out.push(m.slug));
  return out;
}

function refreshVisibleModuleCards() {
  if (state.view !== 'home' || !state.selectedYear) return;

  document.querySelectorAll('.module-card').forEach(card => {
    const slug = card.dataset.moduleSlug;
    if (!slug) return;
    const status = moduleStatus(slug);
    const missing = status === 'missing';

    let stats;
    if (status === 'ready') {
      const d = MODULE_DATA[slug];
      stats = `<p>${d.questions.length} ${t('questions')} · ${d.lessons.length} ${t('courses')}</p>`;
    } else if (missing) {
      stats = `<p>${t('comingSoonSub')}</p>`;
    } else {
      stats = `<p>…</p>`;
    }
    const p = card.querySelector('.module-info p');
    if (p) p.outerHTML = stats;

    if (missing) {
      card.classList.add('coming-soon');
      if (!card.querySelector('.badge-soon')) {
        card.querySelector('.module-info h3').insertAdjacentHTML('beforeend',
          `<span class="badge-soon">${ICONS.clock}${t('comingSoon')}</span>`);
      }
    } else {
      card.classList.remove('coming-soon');
      const badge = card.querySelector('.badge-soon');
      if (badge) badge.remove();
    }
  });

  document.querySelectorAll('.modules-grid').forEach(grid => {
    const cards = [...grid.querySelectorAll('.module-card')];
    cards.sort((a, b) => {
      const aComing = a.classList.contains('coming-soon') ? 1 : 0;
      const bComing = b.classList.contains('coming-soon') ? 1 : 0;
      return aComing - bComing;
    });
    cards.forEach(card => grid.appendChild(card));
  });

  let globalIndex = 0;

  document.querySelectorAll('.semester-card.pending').forEach((card, i) => {
    card.classList.remove('pending');
    card.style.animationDelay = `${i * 300}ms`;
    card.classList.add('animate-in');
  });

  const moduleStartDelay = (state.selectedYear === 1 && state.selectedSemester === null) ? 1000 : 0;
  document.querySelectorAll('.modules-grid').forEach(grid => {
    if (grid.offsetParent === null) return;
    const cards = [...grid.querySelectorAll('.module-card')];
    cards.forEach(card => {
      card.classList.remove('pending');
      card.style.animationDelay = `${moduleStartDelay + globalIndex * 300}ms`;
      card.classList.add('animate-in');
      globalIndex++;
    });
  });
}

/* ════════════ STATE ════════════ */
const state = {
  lang: 'fr',
  view: 'home',
  selectedYear: null,
  selectedSemester: null,
  currentModule: null,
  filterYear: [],
  filterRot: [],
  filterUnit: [],
  filterLesson: [],
  filterSearch: '',
  sortYear: 'desc',
  sortLesson: 'asc',
  userAnswers: {},
  checkedQuestions: {},
  modulePhase: 'welcome',
  visibleCount: PAGE_SIZE
};

let msYear = null, msRot = null, msUnit = null, msLesson = null;
let lastModuleSlug = null;
let routeGeneration = 0;

/* ════════════ HELPERS ════════════ */
function getYearModules(y) {
  const c = CURRICULUM[y];
  if (!c) return [];
  if (c.unities || c.modules) {
    return [...(c.unities || []), ...(c.modules || [])];
  }
  return [];
}
function getSemesterModules(y, semId) {
  const c = CURRICULUM[y];
  if (!c || !c.semesters) return [];
  const s = c.semesters.find(x => x.id === semId);
  return s ? s.modules : [];
}
function getOtherModules(y) {
  const c = CURRICULUM[y];
  return c && c.otherModules ? c.otherModules : [];
}
function findModule(year, slug) {
  const c = CURRICULUM[year];
  if (!c) return null;
  if (c.semesters) for (const s of c.semesters) { const m = s.modules.find(x => x.slug === slug); if (m) return m; }
  if (c.otherModules) { const m = c.otherModules.find(x => x.slug === slug); if (m) return m; }
  if (c.unities) { const m = c.unities.find(x => x.slug === slug); if (m) return m; }
  if (c.modules) { const m = c.modules.find(x => x.slug === slug); if (m) return m; }
  return null;
}
function findModuleBySlug(slug) {
  for (let y = 1; y <= 6; y++) {
    const m = findModule(y, slug);
    if (m) return { year: y, module: m };
  }
  return null;
}
function yearTotalModules(y) {
  const c = CURRICULUM[y];
  if (!c) return 0;
  if (c.semesters) {
    const semCount = c.semesters.reduce((n, s) => n + s.modules.length, 0);
    return semCount + (c.otherModules ? c.otherModules.length : 0);
  }
  return (c.unities ? c.unities.length : 0) + (c.modules ? c.modules.length : 0);
}

function shouldShowRotation(year, slug) {
  if (year === 1 || year === 2 || year === 3) return false;
  if (!MODULE_DATA[slug]) return false;
  const rots = new Set(MODULE_DATA[slug].questions.map(q => q.rot || 0));
  return rots.size >= 2;
}

function shouldShowUnit(slug) {
  if (!MODULE_DATA[slug]) return false;
  const units = new Set(
    MODULE_DATA[slug].questions
      .map(q => q.unit || '')
      .filter(Boolean)
  );
  return units.size >= 2;
}

/* ════════════ ROUTER ════════════ */
async function applyRoute() {
  const gen = ++routeGeneration;
  const hash = window.location.hash.replace(/^#\/?/, '');
  const params = new URLSearchParams(hash);
  const moduleSlug = params.get('module');
  const yearStr = params.get('year');
  const semStr = params.get('sem');

  if (moduleSlug) {
    const found = findModuleBySlug(moduleSlug);
    if (!found) {
      showToast(`<b>${t('moduleNotFound')}</b>`);
      window.location.hash = '';
      return;
    }

    state.selectedYear = found.year;
    state.currentModule = found.module;
    state.view = 'module';

    if (!moduleHasData(moduleSlug)) await loadModule(moduleSlug);
    if (gen !== routeGeneration) return;

    if (moduleHasData(moduleSlug)) {
      if (lastModuleSlug !== moduleSlug) {
        state.filterYear = [];
        state.filterRot = [];
        state.filterUnit = [];
        state.filterLesson = [];
        state.filterSearch = '';
        state.sortYear = 'desc';
        state.sortLesson = 'asc';
        state.userAnswers = {};
        state.checkedQuestions = {};
        state.modulePhase = 'welcome';
        state.visibleCount = PAGE_SIZE;
      }
      lastModuleSlug = moduleSlug;
      renderModuleView();
      window.scrollTo(0, 0);
      return;
    } else {
      showToast(`<b>${t('comingSoonToast')}</b>`);
      window.location.hash = 'year=' + found.year;
      return;
    }
  }

  lastModuleSlug = null;
  state.view = 'home';
  state.currentModule = null;

  if (yearStr) {
    const y = +yearStr;
    state.selectedYear = y;
    state.selectedSemester = semStr ? +semStr : null;

    $('semester-grid').innerHTML = '';
    $('other-grid').innerHTML = '';
    $('modules-grid').innerHTML = '';

    renderHome(false, true);

    requestAnimationFrame(() => {
      const target = (y === 1 && !semStr) ? 'semester-section' : 'modules-section';
      const el = $(target);
      if (el && el.style.display !== 'none') {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    let slugs = [];
    if (y === 1) {
      if (state.selectedSemester) {
        slugs = getSemesterModules(1, state.selectedSemester).map(m => m.slug);
      } else {
        slugs = [
          ...getSemesterModules(1, 1).map(m => m.slug),
          ...getSemesterModules(1, 2).map(m => m.slug),
          ...getOtherModules(1).map(m => m.slug)
        ];
      }
    } else {
      slugs = allSlugsForYear(y);
    }

    ensureModules(slugs).then(() => {
      if (gen !== routeGeneration) return;
      refreshVisibleModuleCards();
    });
  } else {
    state.selectedYear = null;
    state.selectedSemester = null;
    $('semester-grid').innerHTML = '';
    $('other-grid').innerHTML = '';
    $('modules-grid').innerHTML = '';
    $('years-grid').innerHTML = '';
    renderHome(true, false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* ════════════ MULTISELECT ════════════ */
function createMultiselect(rootEl, opts) {
  const { stateKey, allLabel, pluralLabel, items, parseValue } = opts;
  const uid = 'ms-' + stateKey;

  rootEl.innerHTML = `
    <button class="ms-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" id="${uid}-trigger">
      <span class="ms-label">${allLabel}</span>
    </button>
    <div class="ms-panel" role="listbox" aria-labelledby="${uid}-trigger">
      <div class="ms-actions">
        <button type="button" data-ms-all>${t('msAll')}</button>
        <button type="button" data-ms-none>${t('msNone')}</button>
      </div>
      <div class="ms-list">
        ${items.map(item => `
          <label class="ms-option" data-value="${esc(item.value)}">
            <input type="checkbox" value="${esc(item.value)}">
            <span>${esc(item.label)}</span>
          </label>
        `).join('')}
      </div>
    </div>
  `;

  const trigger = rootEl.querySelector('.ms-trigger');
  const panel = rootEl.querySelector('.ms-panel');
  const labelEl = trigger.querySelector('.ms-label');
  const checkboxes = rootEl.querySelectorAll('input[type="checkbox"]');

  function updateLabel() {
    const count = state[stateKey].length;
    const total = items.length;
    if (count === 0) {
      labelEl.textContent = allLabel;
      trigger.classList.remove('has-selection');
    } else if (count === total && total > 1) {
      labelEl.textContent = allLabel;
      trigger.classList.add('has-selection');
    } else if (count === 1) {
      const found = items.find(i => String(i.value) === String(state[stateKey][0]));
      labelEl.textContent = found ? found.label : String(state[stateKey][0]);
      trigger.classList.add('has-selection');
    } else {
      labelEl.textContent = `${count} ${pluralLabel}`;
      trigger.classList.add('has-selection');
    }
  }

  function syncCheckboxes() {
    checkboxes.forEach(cb => {
      const val = parseValue(cb.value);
      const isChecked = state[stateKey].some(v => v === val);
      cb.checked = isChecked;
      cb.closest('.ms-option').classList.toggle('checked', isChecked);
    });
  }

  function openPanel() { closeAllPanels(panel); syncCheckboxes(); panel.classList.add('open'); trigger.setAttribute('aria-expanded', 'true'); }
  function closePanel() { panel.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); }
  function refresh() { syncCheckboxes(); updateLabel(); }

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    if (panel.classList.contains('open')) closePanel();
    else openPanel();
  });
  checkboxes.forEach(cb => cb.addEventListener('change', () => {
    const val = parseValue(cb.value);
    if (cb.checked) { if (!state[stateKey].some(v => v === val)) state[stateKey].push(val); }
    else { state[stateKey] = state[stateKey].filter(v => v !== val); }
    refresh();
    onFilterChange();
  }));
  rootEl.querySelector('[data-ms-all]').addEventListener('click', (e) => {
    e.stopPropagation();
    state[stateKey] = items.map(i => i.value);
    refresh(); onFilterChange();
  });
  rootEl.querySelector('[data-ms-none]').addEventListener('click', (e) => {
    e.stopPropagation();
    state[stateKey] = [];
    refresh(); onFilterChange();
  });
  panel.addEventListener('click', (e) => e.stopPropagation());
  updateLabel();
  return { refresh, closePanel, trigger };
}

function closeAllPanels(except = null) {
  document.querySelectorAll('.ms-panel.open').forEach(p => {
    if (p === except) return;
    p.classList.remove('open');
    p.closest('.multiselect')?.querySelector('.ms-trigger')?.setAttribute('aria-expanded', 'false');
  });
}

/* ════════════ BACK-TO-FILTERS VISIBILITY ════════════ */
function updateBarVisibility() {
  const ctrl = $('controls');
  const btn = $('back-to-filters');
  if (!ctrl || !btn) return;
  const show = state.view === 'module' && state.modulePhase === 'results'
    && ctrl.getBoundingClientRect().top < 0;
  btn.classList.toggle('visible', show);
}

/* ════════════ TOAST ════════════ */
let toastTimeout;
function showToast(msg) {
  let toast = $('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.innerHTML = msg;
  void toast.offsetHeight;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2400);
}

/* ════════════ HOME RENDER ════════════ */
function renderHome(animate = true, pending = false) {
  $('view-home').style.display = 'block';
  $('view-module').style.display = 'none';

  $('hero-badge').textContent = t('heroBadge');
  $('hero-title').innerHTML = t('heroTitle');
  $('hero-sub').textContent = t('heroSub');
  $('years-title').textContent = t('yearsTitle');
  $('years-sub').textContent = t('yearsSub');
  $('sem-title').textContent = t('semTitle');
  $('sem-sub').textContent = t('semSub');
  $('other-title').textContent = t('otherTitle');
  $('other-sub').textContent = t('otherSub');

  $('footer-contact-text').textContent = t('footerContact');

  renderYears(animate, false);
  renderSemesters(animate, pending);
  renderOtherModules(animate, pending);
  renderModules(animate, pending);
  updateBarVisibility();
}

function renderYears(animate = true, pending = false) {
  const years = [1,2,3,4,5,6];
  const grid = $('years-grid');

  if (grid.children.length > 0) {
    [...grid.children].forEach((card, i) => {
      const y = years[i];
      card.classList.toggle('active', state.selectedYear === y);
      card.querySelector('.year-label').textContent = t('yearLabel')(y);
      card.querySelector('.year-count').textContent = t('modCount')(yearTotalModules(y));
    });
    return;
  }

  grid.innerHTML = years.map((y, i) => {
    const total = yearTotalModules(y);
    const isActive = state.selectedYear === y ? ' active' : '';
    const pendingClass = pending ? ' pending' : '';
    const animClass = (!pending && animate) ? ' animate-in' : '';
    const delay = (!pending && animate) ? ` style="animation-delay:${i*300}ms"` : '';
    return `<button class="year-card${animClass}${isActive}${pendingClass}"${delay} data-year="${y}">
      <span class="year-big">${y}</span>
      <span class="year-info">
        <span class="year-label">${t('yearLabel')(y)}</span>
        <span class="year-count">${t('modCount')(total)}</span>
      </span>
    </button>`;
  }).join('');
}

function renderSemesters(animate = true, pending = false) {
  const sec = $('semester-section');
  if (state.selectedYear !== 1) { 
    sec.style.display = 'none'; 
    $('semester-grid').innerHTML = '';
    return; 
  }
  sec.style.display = 'block';
  const grid = $('semester-grid');

  if (grid.children.length > 0) {
    [...grid.children].forEach((card, i) => {
      const s = i + 1;
      card.classList.toggle('active', state.selectedSemester === s);
      const mods = getSemesterModules(1, s);
      const label = s === 1 ? t('sem1') : t('sem2');
      card.querySelector('h3').textContent = label;
      card.querySelector('p').textContent = t('modCount')(mods.length);
    });
    return;
  }

  grid.innerHTML = [1,2].map((s, i) => {
    const mods = getSemesterModules(1, s);
    const label = s === 1 ? t('sem1') : t('sem2');
    const isActive = state.selectedSemester === s ? ' active' : '';
    const pendingClass = pending ? ' pending' : '';
    const animClass = (!pending && animate) ? ' animate-in' : '';
    const delay = (!pending && animate) ? ` style="animation-delay:${i*300}ms"` : '';
    return `<button class="semester-card${animClass}${isActive}${pendingClass}"${delay} data-semester="${s}">
      <div class="semester-badge">S${s}</div>
      <h3>${label}</h3>
      <p>${t('modCount')(mods.length)}</p>
    </button>`;
  }).join('');
}

function renderOtherModules(animate = true, pending = false) {
  const sec = $('other-section');
  if (state.selectedYear !== 1 || state.selectedSemester !== null) { 
    sec.style.display = 'none'; 
    $('other-grid').innerHTML = '';
    return; 
  }
  const list = getOtherModules(1);
  if (!list.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';

  const grid = $('other-grid');
  const sortedList = sortByStatus(list);
  grid.innerHTML = sortedList.map((m, i) => renderModuleCard(m, i, animate, pending)).join('');
}

function renderModules(animate = true, pending = false) {
  const sec = $('modules-section');
  if (!state.selectedYear) { 
    sec.style.display = 'none'; 
    $('modules-grid').innerHTML = '';
    return; 
  }

  if (state.selectedYear === 1) {
    if (state.selectedSemester === null) { 
      sec.style.display = 'none'; 
      $('modules-grid').innerHTML = '';
      return; 
    }
    const list = getSemesterModules(1, state.selectedSemester);
    if (!list.length) { sec.style.display = 'none'; return; }
    sec.style.display = 'block';

    const sortedList = sortByStatus(list);

    const semLabel = state.selectedSemester === 1 ? t('sem1') : t('sem2');
    $('mod-title-section').textContent = `${t('modTitleSem')} ${semLabel}`;
    $('mod-sub-section').textContent = t('modSubTemplate').replace('{year}', t('yearLabel')(1)).replace('{sem}', semLabel).replace('{n}', sortedList.length);

    $('modules-grid').innerHTML = `<div class="modules-grid">` + sortedList.map((m, i) => renderModuleCard(m, i, animate, pending)).join('') + `</div>`;
    return;
  }

  const c = CURRICULUM[state.selectedYear];
  if (!c) { sec.style.display = 'none'; return; }

  const unities = sortByStatus(c.unities || []);
  const modules = sortByStatus(c.modules || []);

  if (!unities.length && !modules.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';

  $('mod-title-section').textContent = t('modTitleYear');
  $('mod-sub-section').textContent = t('modSubYear').replace('{year}', t('yearLabel')(state.selectedYear)).replace('{n}', unities.length + modules.length);

  let html = '';
  let startIndex = 0;

  if (unities.length) {
    html += `<h3 class="sub-header">Unités</h3>`;
    html += `<div class="modules-grid">`;
    html += unities.map((m, i) => renderModuleCard(m, i, animate, pending)).join('');
    html += `</div>`;
    startIndex = unities.length;
  }

  if (modules.length) {
    if (unities.length) {
      html += `<h3 class="sub-header">Modules</h3>`;
    }
    html += `<div class="modules-grid">`;
    html += modules.map((m, i) => renderModuleCard(m, i + startIndex, animate, pending)).join('');
    html += `</div>`;
  }

  $('modules-grid').innerHTML = html;
}

function renderModuleCard(m, i, animate = true, pending = false) {
  const name = state.lang === 'fr' ? m.name.fr : m.name.en;
  const status = moduleStatus(m.slug);
  const missing = status === 'missing';
  const cs = missing ? ' coming-soon' : '';
  const badge = missing
    ? `<span class="badge-soon">${ICONS.clock}${t('comingSoon')}</span>`
    : '';
  let stats;
  if (status === 'ready') {
    const d = MODULE_DATA[m.slug];
    stats = `<p>${d.questions.length} ${t('questions')} · ${d.lessons.length} ${t('courses')}</p>`;
  } else if (missing) {
    stats = `<p>${t('comingSoonSub')}</p>`;
  } else {
    stats = `<p>…</p>`;
  }
  const pendingClass = pending ? ' pending' : '';
  const animClass = (!pending && animate) ? ' animate-in' : '';
  const delay = (!pending && animate) ? ` style="animation-delay:${i * 300}ms"` : '';
  return `<button class="module-card${animClass}${cs}${pendingClass}"${delay} data-module-slug="${m.slug}" data-module-name="${esc(name)}">
    <div class="module-icon">${ICONS[m.icon] || ICONS.flask}</div>
    <div class="module-info">
      <h3>${esc(name)} ${badge}</h3>
      ${stats}
    </div>
    <span class="module-arrow">${ICONS.arrow}</span>
  </button>`;
}

/* ════════════ MODULE VIEW ════════════ */
function renderModuleView(preserveVisibleCount = false) {
  const m = state.currentModule;
  $('view-home').style.display = 'none';
  $('view-module').style.display = 'block';

  $('back-label').textContent = t('back');
  $('back-to-filters-label').textContent = t('backToFilters');
  $('reset-label').textContent = t('reset');
  $('empty-title').textContent = t('emptyTitle');
  $('empty-sub').textContent = t('emptySub');
  $('f-search').placeholder = t('searchPlaceholder');
  $('f-search').value = state.filterSearch;

  const name = state.lang === 'fr' ? m.name.fr : m.name.en;
  const data = MODULE_DATA[m.slug];
  $('mod-title-view').textContent = name;
  $('mod-meta-view').textContent = `${data.questions.length} ${t('questions')} · ${data.lessons.length} ${t('courses')} · ${t('yearLabel')(state.selectedYear)}`;
  $('mod-icon-view').innerHTML = ICONS[m.icon] || ICONS.flask;

  rebuildFilterOptions();
  renderModuleBody(preserveVisibleCount);
  updateBarVisibility();
}

function rebuildFilterOptions() {
  const data = MODULE_DATA[state.currentModule.slug];

  $('sort-year').innerHTML =
    `<option value="desc">${t('sortYearDesc')}</option>` +
    `<option value="asc">${t('sortYearAsc')}</option>`;
  $('sort-year').value = state.sortYear;
  $('sort-lesson').innerHTML =
    `<option value="asc">${t('sortLessonAsc')}</option>` +
    `<option value="desc">${t('sortLessonDesc')}</option>`;
  $('sort-lesson').value = state.sortLesson;

  const yearVals = [...new Set(data.questions.map(q => q.year))].sort((a, b) => b - a);
  msYear = createMultiselect($('ms-year'), {
    stateKey: 'filterYear',
    allLabel: t('filterExam'),
    pluralLabel: state.lang === 'fr' ? 'années' : 'years',
    items: yearVals.map(y => ({ value: y, label: String(y) })),
    parseValue: v => +v
  });

  const showRot = shouldShowRotation(state.selectedYear, state.currentModule.slug);
  $('ms-rot').style.display = showRot ? '' : 'none';
  if (showRot) {
    const rotVals = [...new Set(data.questions.map(q => q.rot || 0))].sort((a, b) => a - b);
    msRot = createMultiselect($('ms-rot'), {
      stateKey: 'filterRot',
      allLabel: t('filterRot'),
      pluralLabel: 'rotations',
      items: rotVals.map(r => ({ value: r, label: rotName(r) })),
      parseValue: v => +v
    });
  } else {
    state.filterRot = [];
    $('ms-rot').innerHTML = '';
    msRot = null;
  }

  const showUnit = shouldShowUnit(state.currentModule.slug);
  $('ms-unit').style.display = showUnit ? '' : 'none';
  if (showUnit) {
    const unitVals = [...new Set(data.questions.map(q => q.unit).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
    msUnit = createMultiselect($('ms-unit'), {
      stateKey: 'filterUnit',
      allLabel: t('filterUnit'),
      pluralLabel: t('filterUnitPlural'),
      items: unitVals.map(u => ({ value: u, label: u })),
      parseValue: v => v
    });
  } else {
    state.filterUnit = [];
    $('ms-unit').innerHTML = '';
    msUnit = null;
  }

  const lessonVals = sortLessons([...new Set(data.questions.map(q => q.lesson))]);
  msLesson = createMultiselect($('ms-lesson'), {
    stateKey: 'filterLesson',
    allLabel: t('filterLesson'),
    pluralLabel: state.lang === 'fr' ? 'cours' : 'courses',
    items: lessonVals.map(l => ({ value: l, label: l })),
    parseValue: v => v
  });
}

function renderModuleBody(preserveVisibleCount = false) {
  const w = $('module-welcome');
  if (state.modulePhase === 'welcome') {
    w.style.display = '';
    $('questions-container').innerHTML = '';
    $('empty').style.display = 'none';
    $('load-more-wrap').style.display = 'none';
    $('result-count').innerHTML = '';
    const data = MODULE_DATA[state.currentModule.slug];
    $('module-welcome-title').textContent = t('welcomeTitle');
    $('module-welcome-sub').textContent = t('welcomeSub')(data.questions.length);
  } else {
    w.style.display = 'none';
    renderQuestions(!preserveVisibleCount);
  }
}

function onFilterChange() {
  const wasWelcome = state.modulePhase === 'welcome';
  state.modulePhase = 'results';
  state.visibleCount = PAGE_SIZE;
  renderModuleBody();
  if (wasWelcome && window.scrollY > 120) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function getFilteredQuestions() {
  if (!state.currentModule) return [];
  const data = MODULE_DATA[state.currentModule.slug];
  const search = state.filterSearch.trim().toLowerCase();
  return data.questions
    .map((q, idx) => ({ ...q, _idx: idx }))
    .filter(q => {
      if (state.filterYear.length && !state.filterYear.includes(q.year)) return false;
      if (state.filterRot.length && !state.filterRot.includes(q.rot || 0)) return false;
      if (state.filterUnit.length && !state.filterUnit.includes(q.unit || '')) return false;
      if (state.filterLesson.length && !state.filterLesson.includes(q.lesson)) return false;
      if (search && !(q.text.toLowerCase().includes(search) || q.options.some(o => o.toLowerCase().includes(search)))) return false;
      return true;
    })
    .sort(compareQuestions);
}

function compareQuestions(a, b) {
  const yearCmp = state.sortYear === 'asc' ? a.year - b.year : b.year - a.year;
  if (yearCmp !== 0) return yearCmp;
  return state.sortLesson === 'desc'
    ? b.lesson.localeCompare(a.lesson, 'fr', { sensitivity: 'base' })
    : a.lesson.localeCompare(b.lesson, 'fr', { sensitivity: 'base' });
}

function renderQuestions(reset, append = false) {
  if (state.modulePhase !== 'results') return;
  const list = getFilteredQuestions();
  if (reset) state.visibleCount = PAGE_SIZE;
  const n = list.length;
  $('result-count').innerHTML = `<b>${n}</b> ${n > 1 ? t('resultsPlural') : t('results')}`;

  if (!n) {
    $('questions-container').innerHTML = '';
    $('empty').style.display = 'block';
    $('load-more-wrap').style.display = 'none';
    return;
  }
  $('empty').style.display = 'none';
  renderVisibleQuestions(list, append);
}

function renderVisibleQuestions(list, append = false) {
  const container = $('questions-container');
  const visible = list.slice(0, state.visibleCount);
  const start = append ? Math.max(0, visible.length - PAGE_SIZE) : 0;

  const html = visible.slice(start).map((q, i) => {
    const idx = start + i;
    const qid = questionId(state.currentModule.slug, q, q._idx);
    return `<div class="q-card" data-qid="${qid}">${renderQuestionCard(q, idx, qid)}</div>`;
  }).join('');

  if (append) container.insertAdjacentHTML('beforeend', html);
  else        container.innerHTML = html;

  updateLoadMoreButton(list.length);
}

function updateLoadMoreButton(total) {
  const remaining = total - state.visibleCount;
  if (remaining > 0) {
    $('load-more-wrap').style.display = 'block';
    $('btn-load-more').textContent = `${t('loadMore')} (${t('loadMoreRemaining')(remaining)})`;
  } else {
    $('load-more-wrap').style.display = 'none';
  }
}

function renderQuestionCard(q, idx, qid) {
  const isChecked = !!state.checkedQuestions[qid];
  const uAns = state.userAnswers[qid] || new Set();
  const correctAns = q.answer.split('').filter(c => LETTERS.includes(c));
  const result = isChecked ? classifyAnswer(uAns, correctAns) : null;
  const showRot = shouldShowRotation(state.selectedYear, state.currentModule.slug);
  const showUnit = shouldShowUnit(state.currentModule.slug);

  const opts = q.options.map((c, j) => {
    const L = LETTERS[j];
    const isSel = uAns.has(L);
    const isCor = correctAns.includes(L);
    let cls = 'opt';
    let icon = '';
    if (isChecked) {
      if (isCor && isSel) { cls += ' correct'; icon = '<span class="check">✓</span>'; }
      else if (isCor && !isSel && result === 'partial') { cls += ' partial'; icon = '<span class="half">◐</span>'; }
      else if (isCor && !isSel) { cls += ' correct'; icon = '<span class="check">✓</span>'; }
      else if (!isCor && isSel) { cls += ' incorrect'; icon = '<span class="cross">✕</span>'; }
    } else if (isSel) cls += ' selected';
    return `<button class="${cls}" data-opt-qid="${qid}" data-letter="${L}" ${isChecked ? 'disabled' : ''}>
      <span class="letter">${L}</span>
      <span class="text">${esc(c)}</span>${icon}
    </button>`;
  }).join('');

  let feedback = '';
  if (isChecked) {
    const label = result === 'correct' ? t('correct') : result === 'partial' ? t('partial') : t('incorrect');
    feedback = `<div class="feedback show ${result}"><span class="dot"></span>${label}</div>`;
  }
  const clearStyle = (!isChecked && uAns.size === 0) ? 'style="display:none"' : '';

  return `<div class="q-head">
      <div class="q-meta">
        <span class="tag tag-year">${q.year}</span>
        ${showRot ? `<span class="tag tag-rot">${rotName(q.rot || 0)}</span>` : ''}
        ${showUnit && q.unit ? `<span class="tag tag-unit">${esc(q.unit)}</span>` : ''}
        <span class="tag tag-lesson">${esc(q.lesson)}</span>
      </div>
      <span class="q-index">${String(idx + 1).padStart(2, '0')}</span>
    </div>
    <div class="q-text">${esc(q.text)}</div>
    <div class="options">${opts}</div>
    <div class="q-footer">
      <div class="action-btns">
        <button class="validate-btn" data-validate-qid="${qid}" ${isChecked || uAns.size === 0 ? 'disabled' : ''}>${t('verify')}</button>
        <button class="clear-btn" data-clear-qid="${qid}" ${clearStyle}>${t('clear')}</button>
      </div>
      ${feedback}
    </div>`;
}

function classifyAnswer(userSet, correctAns) {
  if (!userSet || userSet.size === 0) return 'incorrect';
  const allSelCorrect = [...userSet].every(x => correctAns.includes(x));
  if (!allSelCorrect) return 'incorrect';
  if (userSet.size === correctAns.length) return 'correct';
  return 'partial';
}

function updateCard(qid) {
  const card = document.querySelector(`.q-card[data-qid="${CSS.escape(qid)}"]`);
  if (!card) return;
  const list = getFilteredQuestions();
  const q = list.find(x => questionId(state.currentModule.slug, x, x._idx) === qid);
  if (!q) return;
  const idx = list.indexOf(q);
  card.innerHTML = renderQuestionCard(q, idx, qid);
}

/* ════════════ NAVIGATION ════════════ */
function setLang(lang) {
  if (state.lang === lang) return;
  routeGeneration++; 
  state.lang = lang;
  $('lang-fr').classList.toggle('active', lang === 'fr');
  $('lang-en').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;
  if (state.view === 'home') {
    renderHome();
  } else {
    renderModuleView(true);
  }
}

function selectYear(y) {
  const targetHash = 'year=' + y;
  if (window.location.hash === '#' + targetHash) {
    applyRoute();
  } else {
    window.location.hash = targetHash;
  }
}

function selectSemester(s) {
  const targetHash = 'year=1&sem=' + s;
  if (window.location.hash === '#' + targetHash) {
    applyRoute();
  } else {
    window.location.hash = targetHash;
  }
}

function goToYearGrid() {
  state.selectedYear = null;
  state.selectedSemester = null;
  $('semester-grid').innerHTML = '';
  $('other-grid').innerHTML = '';
  $('modules-grid').innerHTML = '';
  $('years-grid').innerHTML = '';
  if (window.location.hash && window.location.hash !== '#') {
    window.location.hash = '';
  } else {
    applyRoute();
  }
}

function goBackFromModule() {
  if (state.selectedYear) {
    window.location.hash = 'year=' + state.selectedYear;
  } else {
    window.location.hash = '';
  }
}

function resetFilters() {
  closeAllPanels();
  state.filterYear = [];
  state.filterRot = [];
  state.filterUnit = [];
  state.filterLesson = [];
  state.filterSearch = '';
  state.sortYear = 'desc';
  state.sortLesson = 'asc';
  state.modulePhase = 'welcome';
  state.visibleCount = PAGE_SIZE;
  state.userAnswers = {};
  state.checkedQuestions = {};
  $('f-search').value = '';
  $('sort-year').value = 'desc';
  $('sort-lesson').value = 'asc';
  msYear?.refresh();
  msRot?.refresh();
  msUnit?.refresh();
  msLesson?.refresh();
  renderModuleBody();
}

/* ════════════ THEME ════════════ */
const THEME_KEY = 'qcm-theme';
let activeThemeVT = null;
function toggleTheme(btn) {
  const apply = () => {
    const isDark = document.documentElement.classList.contains('theme-dark');
    document.documentElement.classList.toggle('theme-dark', !isDark);
    try { localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark'); } catch(e) {}
  };
  const canVT = typeof document.startViewTransition === 'function'
    && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (canVT) {
    if (btn) {
      const r = btn.getBoundingClientRect();
      const x = r.left + r.width / 2;
      const y = r.top  + r.height / 2;
      const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.documentElement.style.setProperty('--vt-x', x + 'px');
      document.documentElement.style.setProperty('--vt-y', y + 'px');
      document.documentElement.style.setProperty('--vt-r', R + 'px');
    }
    if (activeThemeVT) { try { activeThemeVT.skipTransition(); } catch(e) {} }
    activeThemeVT = document.startViewTransition(apply);
    activeThemeVT.finished.finally(() => { activeThemeVT = null; });
  } else {
    apply();
  }
}

/* ════════════ EVENTS ════════════ */
document.addEventListener('click', (e) => {
  const langBtn = e.target.closest('[data-lang]');
  if (langBtn) { setLang(langBtn.dataset.lang); return; }

  const themeBtn = e.target.closest('#theme-btn');
  if (themeBtn) { toggleTheme(themeBtn); return; }

  if (e.target.closest('[data-action="home"]')) { goToYearGrid(); return; }
  if (e.target.closest('[data-action="back-from-module"]')) { goBackFromModule(); return; }
  if (e.target.closest('[data-action="reset-filters"]')) { resetFilters(); return; }

  const yearCard = e.target.closest('[data-year]');
  if (yearCard) { selectYear(+yearCard.dataset.year); return; }
  const semCard = e.target.closest('[data-semester]');
  if (semCard) { selectSemester(+semCard.dataset.semester); return; }

  const modCard = e.target.closest('[data-module-slug]');
  if (modCard) {
    if (modCard.classList.contains('coming-soon')) {
      showToast(`<b>${t('comingSoonToast')}</b> — ${esc(modCard.dataset.moduleName)}`);
      return;
    }
    window.location.hash = 'module=' + modCard.dataset.moduleSlug;
    return;
  }

  const opt = e.target.closest('[data-opt-qid]');
  if (opt && !opt.disabled) {
    const qid = opt.dataset.optQid;
    const letter = opt.dataset.letter;
    if (state.checkedQuestions[qid]) return;
    if (!state.userAnswers[qid]) state.userAnswers[qid] = new Set();
    if (state.userAnswers[qid].has(letter)) state.userAnswers[qid].delete(letter);
    else state.userAnswers[qid].add(letter);
    updateCard(qid);
    return;
  }
  const v = e.target.closest('[data-validate-qid]');
  if (v && !v.disabled) {
    const qid = v.dataset.validateQid;
    if (state.userAnswers[qid] && state.userAnswers[qid].size > 0) {
      state.checkedQuestions[qid] = true;
      updateCard(qid);
    }
    return;
  }
  const c = e.target.closest('[data-clear-qid]');
  if (c) {
    const qid = c.dataset.clearQid;
    state.userAnswers[qid] = new Set();
    delete state.checkedQuestions[qid];
    updateCard(qid);
    return;
  }

  if (!e.target.closest('.multiselect')) closeAllPanels();
});

document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'sort-year') { state.sortYear = e.target.value; onFilterChange(); }
  else if (id === 'sort-lesson') { state.sortLesson = e.target.value; onFilterChange(); }
});

let searchTimeout;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'f-search') return;
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    state.filterSearch = e.target.value;
    onFilterChange();
  }, 150);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAllPanels();
});

$('back-to-filters').addEventListener('click', () => {
  const ctrl = $('controls');
  if (!ctrl) return;
  const y = ctrl.getBoundingClientRect().top + window.scrollY - 16;
  window.scrollTo({ top: y, behavior: 'smooth' });
});

$('btn-load-more').addEventListener('click', () => {
  state.visibleCount += PAGE_SIZE;
  renderQuestions(false, true);
});

window.addEventListener('scroll', updateBarVisibility, { passive: true });

/* ════════════ INIT ════════════ */
try {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'dark') document.documentElement.classList.add('theme-dark');
} catch(e) {}

window.addEventListener('hashchange', applyRoute);
applyRoute();

console.info('[QCMify] v' + APP_VERSION + ' · data source: ' + DATA_BASE);
</script>
</body>
</html>
