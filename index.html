*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fbfbfd;--bg-2:#f5f5f7;--card:#fff;
  --text:#1d1d1f;--text-2:#55555a;--text-3:#6e6e73;--text-4:#767676;
  --border:rgba(0,0,0,.07);--border-2:rgba(0,0,0,.12);
  --accent:#34c759;--accent-hover:#28a745;--accent-soft:rgba(52,199,89,.08);--accent-text:#157a37;--accent-btn:#157a37;--accent-btn-hover:#0e5c28;
  --success:#34c759;--success-soft:rgba(52,199,89,.09);--success-border:rgba(52,199,89,.3);--success-text:#137a38;
  --danger:#ff3b30;--danger-soft:rgba(255,59,48,.08);--danger-border:rgba(255,59,48,.3);--danger-text:#d70015;
  --warning:#ff9500;--warning-soft:rgba(255,149,0,.10);--warning-border:rgba(255,149,0,.30);--warning-text:#a35500;
  --shadow-sm:0 1px 2px rgba(0,0,0,.03);
  --shadow-md:0 2px 8px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.03);
  --shadow-lg:0 12px 32px rgba(0,0,0,.08);
  --radius-sm:10px;--radius:16px;--radius-lg:20px;--radius-pill:980px;
  --ease:cubic-bezier(.25,.1,.25,1);--ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
  --icon-calendar-down: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386868b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/><path d='M9 14l3 3 3-3'/></svg>");
  --icon-calendar-up:   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386868b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/><path d='M9 17l3-3 3 3'/></svg>");
}
html.theme-dark{
  --bg:#0a0611;--bg-2:#120a1e;--card:#180e26;
  --text:#f5f0ff;--text-2:#c9bce0;--text-3:#9184a8;--text-4:#8c7fa3;
  --border:rgba(168,85,247,.14);--border-2:rgba(168,85,247,.32);
  --accent:#a855f7;--accent-hover:#c084fc;--accent-soft:rgba(147,51,234,.14);--accent-text:#c084fc;--accent-btn:#7e22ce;--accent-btn-hover:#6b21a8;
  --success:#34d399;--success-soft:rgba(52,211,153,.12);--success-border:rgba(52,211,153,.42);--success-text:#6ee7b7;
  --danger:#ec4899;--danger-soft:rgba(236,72,153,.14);--danger-border:rgba(236,72,153,.42);--danger-text:#f472b6;
  --warning:#fbbf24;--warning-soft:rgba(251,191,36,.12);--warning-border:rgba(251,191,36,.40);--warning-text:#fbbf24;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 8px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
  color-scheme:dark;
  --icon-calendar-down: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239184a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/><path d='M9 14l3 3 3-3'/></svg>");
  --icon-calendar-up:   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239184a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/><path d='M9 17l3-3 3 3'/></svg>");
}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;background:var(--bg);transition:background-color .2s var(--ease)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;letter-spacing:-.011em;min-height:100vh;min-height:100dvh;background-image:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(52,199,89,.04),transparent 60%),radial-gradient(ellipse 50% 40% at 90% 20%,rgba(255,149,0,.03),transparent 50%);background-attachment:fixed;transition:background-color .2s var(--ease),color .2s var(--ease)}
html.theme-dark body{background-image:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(147,51,234,.16),transparent 60%),radial-gradient(ellipse 50% 40% at 90% 20%,rgba(236,72,153,.08),transparent 55%)}

::view-transition-old(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){mix-blend-mode:normal;animation:theme-circle 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;will-change:clip-path}
@keyframes theme-circle{from{clip-path:circle(0px at var(--vt-x, 50vw) var(--vt-y, 0px))}to{clip-path:circle(var(--vt-r, 150vmax) at var(--vt-x, 50vw) var(--vt-y, 0px))}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;transition-delay:0s !important;scroll-behavior:auto !important}::view-transition-old(root),::view-transition-new(root){animation-duration:0.001ms !important}}

.container{max-width:1080px;margin:0 auto;padding:0 24px}
svg{display:block}
button{font-family:inherit}

.site-header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--border)}
@supports not (background:color-mix(in srgb,red,blue)){.site-header{background:var(--bg)}}
.site-header .container{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);cursor:pointer;background:none;border:none;padding:0}
.logo-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),#20b2aa);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo-text{font-weight:600;font-size:16px;letter-spacing:-.02em}
.header-right{display:flex;align-items:center;gap:8px}
.lang-toggle{display:inline-flex;background:rgba(0,0,0,.05);border-radius:var(--radius-pill);padding:3px;gap:2px}
html.theme-dark .lang-toggle{background:rgba(255,255,255,.06)}
.lang-toggle button{padding:5px 12px;background:transparent;border:none;border-radius:var(--radius-pill);font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all .2s var(--ease);letter-spacing:.02em}
.lang-toggle button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}
.theme-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:50%;color:var(--text-2);cursor:pointer;transition:all .2s var(--ease)}
.theme-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}
html.theme-dark .theme-btn:hover{background:rgba(255,255,255,.06)}
.theme-btn svg{width:16px;height:16px}
.theme-btn .sun{display:none}
html.theme-dark .theme-btn .sun{display:block}
html.theme-dark .theme-btn .moon{display:none}

.hero{padding:56px 0 40px;text-align:center}
.hero h1{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-bottom:12px}
.hero h1 span{background:linear-gradient(135deg,var(--accent),#20b2aa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html.theme-dark .hero h1 span{background:linear-gradient(135deg,#c084fc,#9333ea 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:1rem;color:var(--text-2);max-width:560px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:var(--accent-soft);color:var(--accent-text);border-radius:var(--radius-pill);font-size:12px;font-weight:600;margin-bottom:18px}
.eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

.section{padding:20px 0 40px}
#semester-section, #modules-section { scroll-margin-top: 80px; }
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.section-head h2{font-size:clamp(1.25rem,2.4vw,1.55rem);font-weight:700;letter-spacing:-.03em;margin-bottom:3px}
.section-head p{font-size:14px;color:var(--text-2)}
.sub-header{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:12px;margin-top:4px}
.sub-header:not(:first-child){margin-top:28px;}

@keyframes cardIn { 
  from { opacity: 0; transform: translateY(24px) scale(0.98); } 
  to   { opacity: var(--final-opacity, 1); transform: translateY(0) scale(1); } 
}
.animate-in { animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

.years-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.year-card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:left;transition:border-color .25s var(--ease),background-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);width:100%;color:var(--text)}
.year-card:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.year-card.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.year-big{font-size:2rem;font-weight:700;letter-spacing:-.04em;line-height:1;min-width:38px;font-variant-numeric:tabular-nums;color:var(--text)}
.year-card.active .year-big{color:var(--accent-text)}
.year-info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.year-label{font-size:14px;font-weight:600;letter-spacing:-.01em}
.year-count{font-size:11.5px;color:var(--text-3);font-weight:500}

.semester-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.semester-card{position:relative;padding:24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;text-align:left;transition:border-color .25s var(--ease),background-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);overflow:hidden;width:100%;color:var(--text)}
.semester-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-soft),transparent 60%);opacity:0;transition:opacity .3s var(--ease);pointer-events:none}
.semester-card:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.semester-card:hover::before,.semester-card.active::before{opacity:1}
.semester-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.semester-badge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--bg-2);border-radius:12px;font-weight:700;font-size:14px;margin-bottom:14px;position:relative}
.semester-card.active .semester-badge{background:var(--accent-btn);color:#fff}
.semester-card h3{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;position:relative}
.semester-card p{font-size:13px;color:var(--text-3);font-weight:500;position:relative}

.modules-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:32px}
.modules-grid:last-child{margin-bottom:0}
.module-card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:left;transition:border-color .25s var(--ease),background-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease),opacity .3s var(--ease);width:100%;color:var(--text);order:0}
.module-card:hover:not(.coming-soon){border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.module-card.coming-soon{--final-opacity: 0.72; opacity: 0.72; cursor:help; order:1}
.module-card.coming-soon:hover{border-color:var(--border);transform:none;box-shadow:var(--shadow-sm)}
.module-icon{width:42px;height:42px;border-radius:11px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;transition:all .25s var(--ease)}
.module-card:hover:not(.coming-soon) .module-icon{background:var(--accent-soft);color:var(--accent-text)}
.module-icon svg{width:20px;height:20px}
.module-info{flex:1;min-width:0}
.module-info h3{font-size:14.5px;font-weight:600;letter-spacing:-.015em;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.module-info p{font-size:12px;color:var(--text-3);font-weight:500}
.badge-soon{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--warning-soft);color:var(--warning-text);border-radius:var(--radius-pill);font-size:10px;font-weight:600}
.badge-soon svg{width:9px;height:9px}
.module-arrow{width:16px;height:16px;color:var(--text-4);flex-shrink:0;transition:all .2s var(--ease)}
.module-card:hover:not(.coming-soon) .module-arrow{transform:translateX(3px);color:var(--accent-text)}
.module-card.coming-soon .module-arrow{opacity:.4}

.pending { opacity: 0 !important; pointer-events: none !important; }

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;letter-spacing:.01em;line-height:1.4}
.tag-year{background:var(--accent-soft);color:var(--accent-text)}
.tag-rot{background:var(--accent-soft);color:var(--accent-text)}
.tag-unit{background:var(--accent-soft);color:var(--accent-text);font-weight:500}
.tag-lesson{background:rgba(0,0,0,.05);color:var(--text-2);font-weight:500}
html.theme-dark .tag-lesson{background:rgba(255,255,255,.06)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:500;border:1px solid transparent;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.btn-secondary{background:rgba(0,0,0,.04);color:var(--text)}
.btn-secondary:hover{background:rgba(0,0,0,.07)}
html.theme-dark .btn-secondary{background:rgba(255,255,255,.06)}
html.theme-dark .btn-secondary:hover{background:rgba(255,255,255,.10)}

.module-hero{padding:28px 0 20px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;background:rgba(0,0,0,.04);border:none;border-radius:var(--radius-pill);font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;margin-bottom:18px;transition:all .2s var(--ease)}
html.theme-dark .back-btn{background:rgba(255,255,255,.06)}
.back-btn:hover{background:rgba(0,0,0,.07);color:var(--text)}
html.theme-dark .back-btn:hover{background:rgba(255,255,255,.10)}
.back-btn svg{width:14px;height:14px}
.module-header{display:flex;align-items:center;gap:16px}
.module-icon-lg{width:60px;height:60px;border-radius:15px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-text);flex-shrink:0}
.module-icon-lg svg{width:28px;height:28px}
.module-header h1{font-size:clamp(1.5rem,2.8vw,2rem);font-weight:700;letter-spacing:-.03em;margin-bottom:3px}
.module-header p{font-size:13.5px;color:var(--text-2);font-weight:500}

.controls{position:relative;z-index:50;padding:12px 0 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;width:16px;height:16px}
.search-wrap input{width:100%;padding:10px 14px 10px 40px;background:rgba(0,0,0,.04);border:1px solid transparent;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:all .2s var(--ease)}
html.theme-dark .search-wrap input{background:rgba(255,255,255,.06)}
.search-wrap input:focus{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
html.theme-dark .search-wrap input:focus{background:var(--card)}
.search-wrap input::placeholder{color:var(--text-3)}

.filters-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.multiselect{position:relative;flex:1 1 160px;min-width:0}
.ms-trigger{width:100%;display:flex;align-items:center;position:relative;padding:10px 36px 10px 13px;background:rgba(0,0,0,.04);border:1px solid transparent;border-radius:var(--radius-sm);font-family:inherit;font-size:13.5px;font-weight:500;color:var(--text);cursor:pointer;transition:all .2s var(--ease);text-align:left}
html.theme-dark .ms-trigger{background:rgba(255,255,255,.06)}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t = k => T[state.lang][k];
const LETTERS = ['A','B','C','D','E'];
const fold = s => String(s).normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae');
const stripTags = s => String(s).replace(/<[^>]*>/g, ' ');

/* Question stems are authored with light inline HTML (<strong>, <sup>…).
   Everything else is dropped, every attribute is stripped, text is preserved. */
const RICH_TAGS = { STRONG: 1, EM: 1, B: 1, I: 1, U: 1, SUP: 1, SUB: 1, BR: 1, SMALL: 1, SPAN: 1 };
function richText(value) {
  const s = String(value == null ? '' : value);
  if (s.indexOf('<') === -1) return esc(s);
  try {
    const doc = new DOMParser().parseFromString('<div>' + s + '</div>', 'text/html');
    const root = doc.body && doc.body.firstChild;
    if (!root) return esc(s);
    const clean = (node) => {
      [...node.children].forEach(el => {
        if (!RICH_TAGS[el.tagName]) { el.replaceWith(doc.createTextNode(el.textContent || '')); return; }
        [...el.attributes].forEach(a => el.removeAttribute(a.name));
        clean(el);
      });
    };
    clean(root);
    return root.innerHTML;
  } catch (e) {
    return esc(s);
  }
}

/* 32-bit FNV-1a — stable content hash used for question IDs and progress signatures */
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return h.toString(36);
}

function questionContent(q) {
  return q.text + '\u0000' + q.options.join('\u0000') + '\u0000' + q.answer;
}

function questionKey(q) {
  return fnv1a(questionContent(q));
}

/* A second, independent 32-bit lane gives ~64 bits when the 32-bit key collides.
   Only used for the colliding row, so existing saved keys stay stable. */
function fnv1a64(str) {
  let a = 0x811c9dc5, b = 0x9e3779b9;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    a ^= c; a = Math.imul(a, 0x01000193) >>> 0;
    b ^= c; b = Math.imul(b, 0x85ebca6b) >>> 0;
  }
  return a.toString(36) + b.toString(36);
}

/* Same content (a question asked in several sessions) keeps one key on purpose.
   Different content that happens to share a 32-bit hash gets a salted 64-bit key. */
function uniqueQuestionKey(q, used) {
  const content = questionContent(q);
  let key = questionKey(q);
  if (used.has(key) && used.get(key) !== content) {
    let salt = 0;
    do {
      key = fnv1a64(content + '#' + salt);
      salt++;
    } while (used.has(key) && used.get(key) !== content);
  }
  used.set(key, content);
  return key;
}

const prefersReducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const smoothBehavior = () => prefersReducedMotion() ? 'auto' : 'smooth';
function scrollInstantTop() {
  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';
  window.scrollTo(0, 0);
  root.style.scrollBehavior = '';
}

function rotName(r) {
  const L = state.lang;
  if (r === 0) return L === 'fr' ? 'Rattrapage' : 'Make-up';
  if (r === 4) return 'Constantine';
  const suffix = L === 'fr' ? (r === 1 ? 'ère' : 'ème') : (['th','st','nd','rd'][r] || 'th');
  return `${r}${suffix} Rotation`;
}

/* single source of truth for a question's state key: "<slug>-<content hash>" */
const qidFor = (slug, q) => slug + '-' + (q._key || questionKey(q));

function moduleHasData(slug) {
  return !!MODULE_DATA[slug]
    && Array.isArray(MODULE_DATA[slug].questions)
    && MODULE_DATA[slug].questions.length > 0;
}

const TD_RE = /^(TD|Sim|TP)(?![a-zA-Z])/;
function lessonCompare(a, b) {
  const aTd = TD_RE.test(a), bTd = TD_RE.test(b);
  if (aTd !== bTd) return aTd ? 1 : -1;
  return a.localeCompare(b, 'fr', { sensitivity: 'base', numeric: true });
}

function sortLessons(arr) {
  return [...arr].sort(lessonCompare);
}

function sortByStatus(list) {
  return [...list].sort((a, b) => {
    const aMissing = moduleStatus(a.slug) === 'missing';
    const bMissing = moduleStatus(b.slug) === 'missing';
    return aMissing === bMissing ? 0 : (aMissing ? 1 : -1);
  });
}

/* ── external JSON loading ── */
const DATA_STATE = {};
const DATA_PROMISES = {};

/* ── manifest: availability + counts, without downloading the question banks ── */
const MANIFEST = { data: null, promise: null, inflight: null, failedAt: 0 };

/* One shared request. A failure is remembered for 15 s instead of being cached
   for the whole session, so a transient offline blip can recover on a later route. */
function fetchManifest() {
  if (MANIFEST.inflight) return MANIFEST.inflight;
  MANIFEST.inflight = fetch(MANIFEST_URL)
    .then(r => (r.ok ? r.json() : null))
    .then(raw => {
      if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
        MANIFEST.data = raw;
        MANIFEST.failedAt = 0;
      } else if (!MANIFEST.data) {
        MANIFEST.failedAt = Date.now();
      }
      return MANIFEST.data;
    })
    .catch(() => {
      if (!MANIFEST.data) MANIFEST.failedAt = Date.now();
      return MANIFEST.data;
    })
    .finally(() => { MANIFEST.inflight = null; });
  return MANIFEST.inflight;
}

function ensureManifest() {
  if (MANIFEST.data) return Promise.resolve(MANIFEST.data);
  if (MANIFEST.promise) return MANIFEST.promise;
  if (MANIFEST.failedAt && Date.now() - MANIFEST.failedAt < 15000) return Promise.resolve(null);
  /* never let a slow manifest hold up the year grid: after 2.5 s we fall back
     to the eager prefetch, and a late answer is still stored for later routes */
  const load = fetchManifest();
  const timeout = new Promise(resolve => setTimeout(() => resolve(null), 2500));
  MANIFEST.promise = Promise.race([load, timeout]).finally(() => { MANIFEST.promise = null; });
  return MANIFEST.promise;
}

function manifestEntry(slug) {
  const m = MANIFEST.data && MANIFEST.data[slug];
  return (m && typeof m === 'object') ? m : null;
}

function moduleStatus(slug) {
  if (moduleHasData(slug)) return 'ready';
  const known = DATA_STATE[slug];
  if (known) return known;
  const entry = manifestEntry(slug);
  if (entry) return Number(entry.q) > 0 ? 'pending' : 'missing';
  return 'unknown';
}

function moduleCounts(slug) {
  const d = MODULE_DATA[slug];
  if (d) return { questions: d.questions.length, lessons: d.lessons.length };
  const entry = manifestEntry(slug);
  if (entry && Number(entry.q) > 0) {
    return { questions: Number(entry.q), lessons: Number(entry.l) || 0 };
  }
  return null;
}

/* single source of truth for the line under a module name */
function moduleStatsMarkup(slug) {
  const status = moduleStatus(slug);
  if (status === 'missing') return `<p>${t('comingSoonSub')}</p>`;
  if (status === 'error') return `<p>${t('loadError')}</p>`;
  const counts = moduleCounts(slug);
  if (!counts) return '<p>…</p>';
  return `<p>${counts.questions} ${t('questions')} · ${counts.lessons} ${t('courses')}</p>`;
}

/* ── LRU window over normalized modules (keeps memory flat while browsing) ── */
const moduleOrder = [];

function touchModule(slug) {
  const i = moduleOrder.indexOf(slug);
  if (i !== -1) moduleOrder.splice(i, 1);
  moduleOrder.push(slug);
  const current = state.currentModule && state.currentModule.slug;
  while (moduleOrder.length > MODULE_CACHE_MAX) {
    const idx = moduleOrder.findIndex(s => s !== current);
    if (idx === -1) return;
    const [drop] = moduleOrder.splice(idx, 1);
    delete MODULE_DATA[drop];
    delete DATA_STATE[drop];
    delete DATA_PROMISES[drop];
  }
}

function normalizeModuleData(raw, slug) {
  if (!raw || !Array.isArray(raw.questions)) throw new Error('missing "questions" array');
  if (raw.questions.length === 0) {
    const e = new Error('questions array is empty (placeholder file)');
    e.empty = true;
    throw e;
  }
  let dropped = 0, duplicates = 0, clamped = 0;
  const questions = [];
  const seen = new Set();
  const usedKeys = new Map();
  raw.questions.forEach(q => {
    if (!q || typeof q !== 'object' || !Array.isArray(q.options)) { dropped++; return; }
    const year = Number(q.year);
    const rot = q.rot == null ? 0 : Number(q.rot);
    const text = String(q.text == null ? '' : q.text).trim();
    const options = q.options.slice(0, LETTERS.length).map(o => String(o == null ? '' : o).trim());
    while (options.length && !options[options.length - 1]) options.pop();
    const rawAnswer = String(q.answer || '').toUpperCase().replace(/[^A-Z]/g, '');
    const answer = [...new Set(rawAnswer.split(''))]
      .filter(c => LETTERS.indexOf(c) !== -1 && LETTERS.indexOf(c) < options.length)
      .sort().join('');
    if (rawAnswer && rawAnswer.length !== answer.length) clamped++;
    const ok = Number.isFinite(year) && Number.isFinite(rot) && text
      && options.length >= 2 && options.every(Boolean) && answer.length > 0;
    if (!ok) { dropped++; return; }
    const item = {
      year, rot,
      unit: String(q.unit == null ? '' : q.unit).trim(),
      lesson: String(q.lesson == null ? '' : q.lesson).trim() || '—',
      text, options, answer
    };
    item._key = uniqueQuestionKey(item, usedKeys);
    /* A question asked in two different exam sessions is real data, not a
       duplicate — the year/rotation filters depend on those rows existing.
       Rows are only flagged when year, rotation AND content are identical. */
    const rowKey = item._key + '|' + item.year + '|' + item.rot;
    if (seen.has(rowKey)) duplicates++;
    seen.add(rowKey);
    item._hay = fold(stripTags(text) + '\n' + options.join('\n'));
    questions.push(item);
  });
  if (clamped) console.warn('[QCMify] ' + (slug || 'module') + '.json: ' + clamped + ' answer(s) referenced a non-existent option — trimmed');
  if (dropped) console.warn('[QCMify] ' + (slug || 'module') + '.json: ' + dropped + ' invalid question(s) skipped');
  if (duplicates) console.warn('[QCMify] ' + (slug || 'module') + '.json: ' + duplicates + ' identical row(s) (same year + rotation + content) — check the source data');
  if (!questions.length) throw new Error('no valid questions after normalisation');
  return {
    lessons: [...new Set(questions.map(q => q.lesson))],
    questions,
    rotCount: new Set(questions.map(q => q.rot)).size,
    unitCount: new Set(questions.map(q => q.unit).filter(Boolean)).size,
    /* changes whenever the content changes → progress saved for an older
       version of a module is discarded instead of being shown against the wrong question */
    signature: fnv1a(questions.map(q => q._key).join('|'))
  };
}

/* questions/year<N>/<slug>.json; falls back to the flat folder for unknown slugs */
function bankUrl(slug) {
  const year = MODULE_YEAR.get(slug);
  return DATA_BASE + DATA_DIR + (year ? 'year' + year + '/' : '') + slug + '.json' + DATA_VERSION_QS;
}

function loadModule(slug) {
  if (moduleHasData(slug)) return Promise.resolve();
  if (DATA_PROMISES[slug]) return DATA_PROMISES[slug];

  DATA_STATE[slug] = 'loading';
  const ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS) : null;
  const url = bankUrl(slug);
  DATA_PROMISES[slug] = fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
    .then(r => {
      if (r.status === 404) { const e = new Error('HTTP 404'); e.notFound = true; throw e; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(raw => {
      MODULE_DATA[slug] = normalizeModuleData(raw, slug);
      DATA_STATE[slug] = 'ready';
      touchModule(slug);
      if (DEBUG) console.info('[QCMify] ' + slug + '.json loaded: '
        + MODULE_DATA[slug].questions.length + ' questions · '
        + MODULE_DATA[slug].lessons.length + ' lessons');
    })
    .catch(err => {
      DATA_STATE[slug] = (err.notFound || err.empty) ? 'missing' : 'error';
      delete DATA_PROMISES[slug];
      console.warn('[QCMify] ' + slug + '.json unavailable — ' + (err.name === 'AbortError' ? 'timeout' : err.message));
    })
    .finally(() => { if (timer) clearTimeout(timer); });
  return DATA_PROMISES[slug];
}

/* Prefetch is paced: a year can hold a dozen modules and several hundred KB each,
   so we keep a small pool instead of firing every request at once (and go gentler
   when the browser reports Data Saver). */
function ensureModules(slugs) {
  const queue = [...new Set(slugs)];
  if (!queue.length) return Promise.resolve();
  const saveData = !!(navigator.connection && navigator.connection.saveData);
  const limit = Math.max(1, Math.min(saveData ? 2 : MAX_FETCH_CONCURRENCY, queue.length));
  let next = 0;
  const worker = () => {
    if (next >= queue.length) return Promise.resolve();
    const slug = queue[next++];
    return loadModule(slug).then(worker);
  };
  return Promise.all(Array.from({ length: limit }, worker));
}

function allSlugsForYear(y) {
  const c = CURRICULUM[y];
  if (!c) return [];
  const out = [];
  if (c.semesters)    c.semesters.forEach(s => s.modules.forEach(m => out.push(m.slug)));
  if (c.otherModules) c.otherModules.forEach(m => out.push(m.slug));
  if (c.unities)      c.unities.forEach(m => out.push(m.slug));
  if (c.modules)      c.modules.forEach(m => out.push(m.slug));
  return out;
}

function refreshVisibleModuleCards() {
  if (state.view !== 'home' || !state.selectedYear) return;

  document.querySelectorAll('.module-card').forEach(card => {
    const slug = card.dataset.moduleSlug;
    if (!slug) return;
    const status = moduleStatus(slug);
    const missing = status === 'missing';

    const stats = moduleStatsMarkup(slug);
    const p = card.querySelector('.module-info p');
    if (p) p.outerHTML = stats;

    if (missing) {
      card.classList.add('coming-soon');
      if (!card.querySelector('.badge-soon')) {
        card.querySelector('.module-info h3').insertAdjacentHTML('beforeend',
          `<span class="badge-soon">${ICON_CLOCK}${t('comingSoon')}</span>`);
      }
    } else {
      card.classList.remove('coming-soon');
      const badge = card.querySelector('.badge-soon');
      if (badge) badge.remove();
    }
  });

  document.querySelectorAll('.modules-grid').forEach(grid => {
    const cards = [...grid.querySelectorAll('.module-card')];
    cards.sort((a, b) => {
      const aComing = a.classList.contains('coming-soon') ? 1 : 0;
      const bComing = b.classList.contains('coming-soon') ? 1 : 0;
      return aComing - bComing;
    });
    cards.forEach(card => grid.appendChild(card));
  });

  let globalIndex = 0;

  document.querySelectorAll('.semester-card.pending').forEach((card, i) => {
    card.classList.remove('pending');
    card.style.animationDelay = `${i * CARD_STAGGER}ms`;
    card.classList.add('animate-in');
  });

  document.querySelectorAll('.modules-grid').forEach(grid => {
    if (grid.offsetParent === null) return;
    const cards = [...grid.querySelectorAll('.module-card')];
    cards.forEach(card => {
      card.classList.remove('pending');
      card.style.animationDelay = `${globalIndex * CARD_STAGGER}ms`;
      card.classList.add('animate-in');
      globalIndex++;
    });
  });
}

/* ════════════ STATE ════════════ */
const state = {
  lang: (function () { try { const l = localStorage.getItem('qcm-lang'); return (l === 'en' || l === 'fr') ? l : 'fr'; } catch (e) { return 'fr'; } })(),
  view: 'home',
  selectedYear: null,
  selectedSemester: null,
  currentModule: null,
  filterYear: [],
  filterRot: [],
  filterUnit: [],
  filterLesson: [],
  filterSearch: '',
  filterMistakes: false,
  sortYear: 'desc',
  userAnswers: {},
  checkedQuestions: {},
  modulePhase: 'welcome',
  visibleCount: PAGE_SIZE,
  exam: null,
  sound: (function () { try { return localStorage.getItem('qcm-sound') !== 'off'; } catch (e) { return true; } })()
};

let msYear = null, msRot = null, msUnit = null, msLesson = null;
let lastModuleSlug = null;
let routeGeneration = 0;
let lastCardQid = null;
/* signature of the module+language the filter widgets were built for */
let filtersBuiltFor = '';

/* ════════════ HELPERS ════════════ */
function getSemesterModules(y, semId) {
  const c = CURRICULUM[y];
  if (!c || !c.semesters) return [];
  const s = c.semesters.find(x => x.id === semId);
  return s ? s.modules : [];
}
function getOtherModules(y) {
  const c = CURRICULUM[y];
  return c && c.otherModules ? c.otherModules : [];
}
function findModule(year, slug) {
  const c = CURRICULUM[year];
  if (!c) return null;
  if (c.semesters) for (const s of c.semesters) { const m = s.modules.find(x => x.slug === slug); if (m) return m; }
  if (c.otherModules) { const m = c.otherModules.find(x => x.slug === slug); if (m) return m; }
  if (c.unities) { const m = c.unities.find(x => x.slug === slug); if (m) return m; }
  if (c.modules) { const m = c.modules.find(x => x.slug === slug); if (m) return m; }
  return null;
}
function findModuleBySlug(slug) {
  for (let y = 1; y <= 6; y++) {
    const m = findModule(y, slug);
    if (m) return { year: y, module: m };
  }
  return null;
}
function yearTotalModules(y) {
  const c = CURRICULUM[y];
  if (!c) return 0;
  if (c.semesters) {
    const semCount = c.semesters.reduce((n, s) => n + s.modules.length, 0);
    return semCount + (c.otherModules ? c.otherModules.length : 0);
  }
  return (c.unities ? c.unities.length : 0) + (c.modules ? c.modules.length : 0);
}

function shouldShowRotation(year, slug) {
  if (year === 1 || year === 2 || year === 3) return false;
  const d = MODULE_DATA[slug];
  return !!d && d.rotCount >= 2;
}

function shouldShowUnit(slug) {
  const d = MODULE_DATA[slug];
  return !!d && d.unitCount >= 2;
}

/* ════════════ PROGRESS (persisted locally) ════════════ */
let progressSaveTimer = null;

const progressKey = slug => PROGRESS_PREFIX + slug;

function currentModuleData() {
  return state.currentModule ? MODULE_DATA[state.currentModule.slug] : null;
}

/* Answers are keyed by content hash, not by position, so editing/reordering a
   module's JSON does not shift saved answers onto the wrong question. The
   per-key check below is what makes that safe: add/remove/rewrite questions and
   only the affected answers change. A whole-module signature guard is *not*
   applied here — it would erase every answer whenever one question was added. */
function restoreProgress(slug, data) {
  state.userAnswers = {};
  state.checkedQuestions = {};
  if (!data || !Array.isArray(data.questions)) return false;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(progressKey(slug)) || 'null'); } catch (e) { return false; }
  if (!saved || saved.v !== PROGRESS_VERSION) return false;
  const valid = new Set(data.questions.map(q => q._key));
  const answers = saved.a || {}, checked = saved.c || {};
  Object.keys(answers).forEach(key => {
    if (!valid.has(key)) return;
    const letters = String(answers[key] || '').split('').filter(c => LETTERS.includes(c));
    if (letters.length) state.userAnswers[slug + '-' + key] = new Set(letters);
  });
  Object.keys(checked).forEach(key => {
    if (!valid.has(key)) return;
    if (state.userAnswers[slug + '-' + key]) state.checkedQuestions[slug + '-' + key] = true;
  });
  return true;
}

/* slug/data can be passed explicitly so a module that is being left (or an
   abandoned exam) is saved under its own key, not under the route we just opened. */
function persistProgress(slug, data) {
  const targetSlug = slug || (state.currentModule && state.currentModule.slug);
  const targetData = data || (targetSlug ? MODULE_DATA[targetSlug] : null);
  if (!targetSlug || !targetData) return;
  const prefix = targetSlug + '-';
  const answers = {}, checked = {};
  Object.keys(state.userAnswers).forEach(qid => {
    if (qid.indexOf(prefix) !== 0) return;
    const set = state.userAnswers[qid];
    if (set && set.size) answers[qid.slice(prefix.length)] = [...set].sort().join('');
  });
  Object.keys(state.checkedQuestions).forEach(qid => {
    if (qid.indexOf(prefix) === 0) checked[qid.slice(prefix.length)] = 1;
  });
  try {
    if (!Object.keys(answers).length && !Object.keys(checked).length) localStorage.removeItem(progressKey(targetSlug));
    else localStorage.setItem(progressKey(targetSlug), JSON.stringify({
      v: PROGRESS_VERSION, sig: targetData.signature, a: answers, c: checked
    }));
  } catch (e) { /* private mode or quota exceeded — progress simply stays in memory */ }
}

function schedulePersist() {
  clearTimeout(progressSaveTimer);
  /* capture the slug: if the route changes before the debounce fires, the answer
     still belongs to the module that was on screen when it was clicked */
  const slug = state.currentModule && state.currentModule.slug;
  progressSaveTimer = setTimeout(() => persistProgress(slug), 250);
}

function moduleStats() {
  const data = currentModuleData();
  if (!data || !state.currentModule) return null;
  const slug = state.currentModule.slug;
  let answered = 0, correct = 0, mistakes = 0;
  data.questions.forEach(q => {
    const qid = qidFor(slug, q);
    if (!state.checkedQuestions[qid]) return;
    answered++;
    if (classifyAnswer(state.userAnswers[qid], q.answer.split('')) === 'correct') correct++;
    else mistakes++;
  });
  return { answered, correct, mistakes, total: data.questions.length };
}

function updateProgressUI() {
  const wrap = $('mod-progress');
  const resetBtn = $('progress-reset');
  const stats = moduleStats();
  if (!wrap) return;
  if (!stats) {
    wrap.hidden = true;
    wrap.innerHTML = '';
    if (resetBtn) resetBtn.hidden = true;
    return;
  }
  const pct = stats.total ? Math.round(stats.answered / stats.total * 100) : 0;
  const label = t('progressLabel')(stats.answered, stats.total, stats.correct);
  wrap.hidden = false;
  wrap.innerHTML =
    `<div class="mod-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${stats.total}" aria-valuenow="${stats.answered}" aria-label="${esc(label)}"><span style="width:${pct}%"></span></div>` +
    `<div class="mod-progress-text">${esc(label)}</div>`;
  if (resetBtn) resetBtn.hidden = stats.answered === 0;
}

function updateMistakesButton() {
  const btn = $('btn-mistakes');
  if (!btn) return;
  const stats = moduleStats();
  const count = stats ? stats.mistakes : 0;
  btn.setAttribute('aria-pressed', String(!!state.filterMistakes));
  btn.innerHTML = `${esc(t('myMistakes'))}${count ? ` <b>${count}</b>` : ''}`;
  /* stays enabled even at 0: clicking it explains how mistakes show up
     (better than a dead disabled button nobody can interpret) */
}

/* Called after every answer mutation: repaint card + counters + persist. */
function afterAnswerChange(qid) {
  updateCard(qid);
  updateProgressUI();
  updateMistakesButton();
  refreshLessonMeta();
  schedulePersist();
}

/* A selection toggle doesn't need a full card rebuild: only classes, aria and the
   two action buttons change. Cheaper, and it keeps the user's focus in place. */
function updateSelectionUI(qid) {
  const cards = document.querySelectorAll(`.q-card[data-qid="${CSS.escape(qid)}"]`);
  if (!cards.length) return;
  const uAns = state.userAnswers[qid] || new Set();
  cards.forEach(card => {
    card.querySelectorAll('[data-opt-qid]').forEach(btn => {
      const on = uAns.has(btn.dataset.letter);
      btn.classList.toggle('selected', on);
      btn.setAttribute('aria-pressed', String(on));
    });
    const validate = card.querySelector('[data-validate-qid]');
    if (validate) validate.disabled = uAns.size === 0;
    const clear = card.querySelector('[data-clear-qid]');
    if (clear) clear.style.display = uAns.size === 0 ? 'none' : '';
  });
}

/* ════════════ ROUTER ════════════ */
let suppressHashRoute = false;

function replaceRoute(hash) {
  const url = window.location.pathname + window.location.search + (hash ? '#' + hash : '');
  try {
    history.replaceState(null, '', url);
  } catch (e) {
    /* file:// and opaque origins can refuse replaceState — fall back to the hash API
       and only swallow the hashchange when the hash actually moved (that event fires
       asynchronously, so applyRoute() below must still be the one that renders) */
    const before = window.location.hash;
    suppressHashRoute = true;
    try { window.location.hash = hash || ''; } catch (e2) {}
    if (window.location.hash === before) suppressHashRoute = false;
  }
  return applyRoute();
}

/* Re-fetches a module that failed to load, then opens it. */
function retryModule(slug, year) {
  delete DATA_PROMISES[slug];
  DATA_STATE[slug] = 'unknown';
  loadModule(slug).then(() => {
    if (moduleHasData(slug)) { window.location.hash = 'module=' + slug; return; }
    showToast(`<b>${t('loadError')}</b>`, () => retryModule(slug, year));
    replaceRoute('year=' + year);
  });
}

async function applyRoute() {
  const gen = ++routeGeneration;
  const hash = window.location.hash.replace(/^#\/?/, '');
  const params = new URLSearchParams(hash);
  const moduleSlug = params.get('module');
  const yearStr = params.get('year');
  const semStr = params.get('sem');
  const qKey = params.get('q');

  if (moduleSlug) {
    const found = findModuleBySlug(moduleSlug);
    if (!found) {
      showToast(`<b>${t('moduleNotFound')}</b>`);
      return replaceRoute('');
    }

    state.selectedYear = found.year;
    state.currentModule = found.module;
    state.view = 'module';

    if (!moduleHasData(moduleSlug)) {
      $('view-home').style.display = 'none';
      $('view-module').style.display = 'none';
      const rl = $('route-loading');
      rl.textContent = t('loading');
      rl.style.display = 'block';
      await loadModule(moduleSlug);
    }
    if (gen !== routeGeneration) return;

    if (moduleHasData(moduleSlug)) {
      if (lastModuleSlug !== moduleSlug) {
        /* clear/undo a running exam (it saves under its own stored slug), then
           flush the module we are leaving before its answers are reset below */
        clearExamState();
        if (lastModuleSlug) persistProgress(lastModuleSlug, MODULE_DATA[lastModuleSlug]);
        clearTimeout(progressSaveTimer);
        progressSaveTimer = null;
        /* filter widgets must be rebuilt for the module we are entering, otherwise
           the previous visit's selections stay visible while the state is empty */
        filtersBuiltFor = '';
        state.filterYear = [];
        state.filterRot = [];
        state.filterUnit = [];
        state.filterLesson = [];
        state.filterSearch = '';
        state.filterMistakes = false;
        state.sortYear = 'desc';
        state.userAnswers = {};
        state.checkedQuestions = {};
        state.modulePhase = 'welcome';
        state.visibleCount = PAGE_SIZE;
        restoreProgress(moduleSlug, MODULE_DATA[moduleSlug]);
      }
      lastModuleSlug = moduleSlug;
      touchModule(moduleSlug);   // keep the LRU window honest when reopening
      renderModuleView();
      scrollInstantTop();
      if (qKey) focusQuestion(qKey);
      return;
    } else {
      const failed = DATA_STATE[moduleSlug] === 'error';
      showToast(
        `<b>${t(failed ? 'loadError' : 'comingSoonToast')}</b>`,
        failed ? () => retryModule(moduleSlug, found.year) : null
      );
      return replaceRoute('year=' + found.year);
    }
  }

  lastModuleSlug = null;
  clearExamState();          // leaving the module abandons any running exam
  state.view = 'home';
  state.currentModule = null;

  if (yearStr) {
    const y = Number(yearStr);
    if (!Number.isInteger(y) || !CURRICULUM[y]) return replaceRoute('');
    let sem = null;
    if (semStr) {
      sem = Number(semStr);
      if (y !== 1 || (sem !== 1 && sem !== 2)) return replaceRoute('year=' + y);
    }
    /* Only tear down the grids whose content actually changes. Rebuilding the
       semester cards on every semester click re-created the DOM nodes, which
       replayed their entry animation a second time. */
    /* one small request decides whether we can paint counts without downloading
       any question bank at all (falls back to eager fetch when there is no manifest) */
    await ensureManifest();
    if (gen !== routeGeneration) return;

    const sameYear = state.selectedYear === y;
    state.selectedYear = y;
    state.selectedSemester = sem;

    if (!sameYear) {
      $('semester-grid').innerHTML = '';
      $('other-grid').innerHTML = '';
    }
    $('modules-grid').innerHTML = '';

    renderHome(false, true);

    requestAnimationFrame(() => {
      const target = (y === 1 && !state.selectedSemester) ? 'semester-section' : 'modules-section';
      const el = $(target);
      if (!el || el.style.display === 'none') return;
      /* Land on the section *title*, just under the sticky header. Centring the
         section (the old block:'center') pushed the title and the first modules
         off-screen whenever the list was taller than the phone viewport. */
      const header = document.querySelector('.site-header');
      const headerH = header ? header.offsetHeight : 60;
      const top = el.getBoundingClientRect().top + window.scrollY - headerH - 12;
      window.scrollTo({ top: Math.max(0, top), behavior: smoothBehavior() });
    });

    let slugs = [];
    if (y === 1) {
      if (state.selectedSemester) {
        slugs = getSemesterModules(1, state.selectedSemester).map(m => m.slug);
      } else {
        slugs = getOtherModules(1).map(m => m.slug);
      }
    } else {
      slugs = allSlugsForYear(y);
    }

    if (MANIFEST.data) {
      /* counts and "coming soon" states are already known: download nothing until
         a card is actually opened */
      requestAnimationFrame(() => {
        if (gen !== routeGeneration) return;
        refreshVisibleModuleCards();
      });
    } else {
      ensureModules(slugs).then(() => {
        if (gen !== routeGeneration) return;
        refreshVisibleModuleCards();
      });
    }
  } else {
    state.selectedYear = null;
    state.selectedSemester = null;
    $('semester-grid').innerHTML = '';
    $('other-grid').innerHTML = '';
    $('modules-grid').innerHTML = '';
    $('years-grid').innerHTML = '';
    renderHome(true, false);
    window.scrollTo({ top: 0, behavior: smoothBehavior() });
  }
}

/* ════════════ MULTISELECT ════════════ */
function createMultiselect(rootEl, opts) {
  const { stateKey, allLabel, pluralLabel, items, parseValue, onOpen } = opts;
  const uid = 'ms-' + stateKey;

  rootEl.innerHTML = `
    <button class="ms-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="${uid}-panel" id="${uid}-trigger">
      <span class="ms-label">${allLabel}</span>
    </button>
    <div class="ms-panel" id="${uid}-panel" role="group" aria-labelledby="${uid}-trigger">
      <div class="ms-actions">
        <button type="button" data-ms-all>${t('msAll')}</button>
        <button type="button" data-ms-none>${t('msNone')}</button>
      </div>
      <div class="ms-list">
        ${items.map(item => `
          <label class="ms-option" data-value="${esc(item.value)}">
            <input type="checkbox" value="${esc(item.value)}">
            <span>${esc(item.label)}</span>${item.meta ? `<span class="ms-meta">${esc(item.meta)}</span>` : ''}
          </label>
        `).join('')}
      </div>
    </div>
  `;

  const trigger = rootEl.querySelector('.ms-trigger');
  const panel = rootEl.querySelector('.ms-panel');
  const labelEl = trigger.querySelector('.ms-label');
  const checkboxes = rootEl.querySelectorAll('input[type="checkbox"]');

  function updateLabel() {
    const count = state[stateKey].length;
    const total = items.length;
    if (count === 0) {
      labelEl.textContent = allLabel;
      trigger.classList.remove('has-selection');
    } else if (count === total && total > 1) {
      labelEl.textContent = allLabel;
      trigger.classList.add('has-selection');
    } else if (count === 1) {
      const found = items.find(i => String(i.value) === String(state[stateKey][0]));
      labelEl.textContent = found ? found.label : String(state[stateKey][0]);
      trigger.classList.add('has-selection');
    } else {
      labelEl.textContent = `${count} ${pluralLabel}`;
      trigger.classList.add('has-selection');
    }
  }

  function syncCheckboxes() {
    checkboxes.forEach(cb => {
      const val = parseValue(cb.value);
      const isChecked = state[stateKey].some(v => v === val);
      cb.checked = isChecked;
      cb.closest('.ms-option').classList.toggle('checked', isChecked);
    });
  }

  function openPanel() {
    closeAllPanels(panel);
    if (typeof onOpen === 'function') onOpen();
    syncCheckboxes();
    panel.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
  }
  function closePanel() { panel.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); }
  function refresh() { syncCheckboxes(); updateLabel(); }

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    if (panel.classList.contains('open')) closePanel();
    else openPanel();
  });
  checkboxes.forEach(cb => cb.addEventListener('change', () => {
    const val = parseValue(cb.value);
    if (cb.checked) { if (!state[stateKey].some(v => v === val)) state[stateKey].push(val); }
    else { state[stateKey] = state[stateKey].filter(v => v !== val); }
    refresh();
    onFilterChange();
  }));
  rootEl.querySelector('[data-ms-all]').addEventListener('click', (e) => {
    e.stopPropagation();
    state[stateKey] = items.map(i => i.value);
    refresh(); onFilterChange();
  });
  rootEl.querySelector('[data-ms-none]').addEventListener('click', (e) => {
    e.stopPropagation();
    state[stateKey] = [];
    refresh(); onFilterChange();
  });
  panel.addEventListener('click', (e) => e.stopPropagation());
  updateLabel();
  return { refresh, closePanel, trigger };
}

function closeAllPanels(except = null) {
  document.querySelectorAll('.ms-panel.open').forEach(p => {
    if (p === except) return;
    p.classList.remove('open');
    p.closest('.multiselect')?.querySelector('.ms-trigger')?.setAttribute('aria-expanded', 'false');
  });
}

/* ════════════ TOAST ════════════ */
let toastTimeout, toastAction = null;

function clearToastAction(toast) {
  toastAction = null;
  if (!toast) return;
  toast.classList.remove('actionable');
  toast.removeAttribute('tabindex');
  toast.setAttribute('role', 'status');
}

/* msg is trusted markup (static strings + escaped names); action makes the toast
   tappable, which is what the "tap to retry" copy always promised. */
function showToast(msg, action) {
  let toast = $('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    document.body.appendChild(toast);
  }
  toast.innerHTML = msg;
  clearTimeout(toastTimeout);
  toastAction = typeof action === 'function' ? action : null;
  if (toastAction) {
    toast.classList.add('actionable');
    toast.setAttribute('role', 'button');
    toast.setAttribute('tabindex', '0');
  } else {
    clearToastAction(toast);
  }
  void toast.offsetHeight;
  toast.classList.add('show');
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
    clearToastAction(toast);
  }, toastAction ? 7000 : 2600);
}

function runToastAction() {
  const fn = toastAction;
  if (!fn) return;
  const toast = $('toast');
  clearToastAction(toast);
  if (toast) toast.classList.remove('show');
  fn();
}

/* ════════════ HOME RENDER ════════════ */
function renderHome(animate = true, pending = false) {
  $('route-loading').style.display = 'none';
  $('view-home').style.display = 'block';
  $('view-module').style.display = 'none';
  /* only one <main> may be exposed at a time */
  $('main-home').hidden = false;
  $('main-module').hidden = true;

  $('hero-badge').textContent = t('heroBadge');
  $('hero-title').innerHTML = t('heroTitle');
  $('hero-sub').textContent = t('heroSub');
  $('years-title').textContent = t('yearsTitle');
  $('years-sub').textContent = t('yearsSub');
  $('sem-title').textContent = t('semTitle');
  $('sem-sub').textContent = t('semSub');
  $('other-title').textContent = t('otherTitle');
  $('other-sub').textContent = t('otherSub');

  renderChrome();

  renderYears(animate, false);
  renderSemesters(animate, pending);
  renderOtherModules(animate, pending);
  renderModules(animate, pending);
  updateBarVisibility();
}

function renderYears(animate = true, pending = false) {
  const years = [1,2,3,4,5,6];
  const grid = $('years-grid');

  if (grid.children.length > 0) {
    [...grid.children].forEach((card, i) => {
      const y = years[i];
      card.classList.toggle('active', state.selectedYear === y);
      card.querySelector('.year-label').textContent = t('yearLabel')(y);
      card.querySelector('.year-count').textContent = t('modCount')(yearTotalModules(y));
    });
    return;
  }

  grid.innerHTML = years.map((y, i) => {
    const total = yearTotalModules(y);
    const isActive = state.selectedYear === y ? ' active' : '';
    const pendingClass = pending ? ' pending' : '';
    const animClass = (!pending && animate) ? ' animate-in' : '';
    const delay = (!pending && animate) ? ` style="animation-delay:${i*CARD_STAGGER}ms"` : '';
    return `<button class="year-card${animClass}${isActive}${pendingClass}"${delay} data-year="${y}">
      <span class="year-big">${y}</span>
      <span class="year-info">
        <span class="year-label">${t('yearLabel')(y)}</span>
        <span class="year-count">${t('modCount')(total)}</span>
      </span>
    </button>`;
  }).join('');
}

function renderSemesters(animate = true, pending = false) {
  const sec = $('semester-section');
  if (state.selectedYear !== 1) { 
    sec.style.display = 'none'; 
    $('semester-grid').innerHTML = '';
    return; 
  }
  sec.style.display = 'block';
  const grid = $('semester-grid');

  if (grid.children.length > 0) {
    [...grid.children].forEach((card, i) => {
      const s = i + 1;
      card.classList.toggle('active', state.selectedSemester === s);
      const mods = getSemesterModules(1, s);
      const label = s === 1 ? t('sem1') : t('sem2');
      card.querySelector('h3').textContent = label;
      card.querySelector('p').textContent = t('modCount')(mods.length);
    });
    return;
  }

  grid.innerHTML = [1,2].map((s, i) => {
    const mods = getSemesterModules(1, s);
    const label = s === 1 ? t('sem1') : t('sem2');
    const isActive = state.selectedSemester === s ? ' active' : '';
    const pendingClass = pending ? ' pending' : '';
    const animClass = (!pending && animate) ? ' animate-in' : '';
    const delay = (!pending && animate) ? ` style="animation-delay:${i*CARD_STAGGER}ms"` : '';
    return `<button class="semester-card${animClass}${isActive}${pendingClass}"${delay} data-semester="${s}">
      <div class="semester-badge">S${s}</div>
      <h3>${label}</h3>
      <p>${t('modCount')(mods.length)}</p>
    </button>`;
  }).join('');
}

function renderOtherModules(animate = true, pending = false) {
  const sec = $('other-section');
  if (state.selectedYear !== 1 || state.selectedSemester !== null) { 
    sec.style.display = 'none'; 
    $('other-grid').innerHTML = '';
    return; 
  }
  const list = getOtherModules(1);
  if (!list.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';

  const grid = $('other-grid');
  const sortedList = sortByStatus(list);
  grid.innerHTML = sortedList.map((m, i) => renderModuleCard(m, i, animate, pending)).join('');
}

function renderModules(animate = true, pending = false) {
  const sec = $('modules-section');
  if (!state.selectedYear) { 
    sec.style.display = 'none'; 
    $('modules-grid').innerHTML = '';
    return; 
  }

  if (state.selectedYear === 1) {
    if (state.selectedSemester === null) { 
      sec.style.display = 'none'; 
      $('modules-grid').innerHTML = '';
      return; 
    }
    const list = getSemesterModules(1, state.selectedSemester);
    if (!list.length) { sec.style.display = 'none'; return; }
    sec.style.display = 'block';

    const sortedList = sortByStatus(list);

    const semLabel = state.selectedSemester === 1 ? t('sem1') : t('sem2');
    $('mod-title-section').textContent = `${t('modTitleSem')} ${semLabel}`;
    $('mod-sub-section').textContent = t('modSubTemplate').replace('{year}', t('yearLabel')(1)).replace('{sem}', semLabel).replace('{n}', sortedList.length);

    $('modules-grid').innerHTML = `<div class="modules-grid">` + sortedList.map((m, i) => renderModuleCard(m, i, animate, pending)).join('') + `</div>`;
    return;
  }

  const c = CURRICULUM[state.selectedYear];
  if (!c) { sec.style.display = 'none'; return; }

  const unities = sortByStatus(c.unities || []);
  const modules = sortByStatus(c.modules || []);

  if (!unities.length && !modules.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';

  $('mod-title-section').textContent = t('modTitleYear');
  $('mod-sub-section').textContent = t('modSubYear').replace('{year}', t('yearLabel')(state.selectedYear)).replace('{n}', unities.length + modules.length);

  let html = '';
  let startIndex = 0;

  if (unities.length) {
    html += `<h3 class="sub-header">${t('unitsHeader')}</h3>`;
    html += `<div class="modules-grid">`;
    html += unities.map((m, i) => renderModuleCard(m, i, animate, pending)).join('');
    html += `</div>`;
    startIndex = unities.length;
  }

  if (modules.length) {
    if (unities.length) {
      html += `<h3 class="sub-header">${t('modulesHeader')}</h3>`;
    }
    html += `<div class="modules-grid">`;
    html += modules.map((m, i) => renderModuleCard(m, i + startIndex, animate, pending)).join('');
    html += `</div>`;
  }

  $('modules-grid').innerHTML = html;
}

function renderModuleCard(m, i, animate = true, pending = false) {
  const name = state.lang === 'fr' ? m.name.fr : m.name.en;
  const status = moduleStatus(m.slug);
  const missing = status === 'missing';
  const cs = missing ? ' coming-soon' : '';
  const badge = missing
    ? `<span class="badge-soon">${ICON_CLOCK}${t('comingSoon')}</span>`
    : '';
  const stats = moduleStatsMarkup(m.slug);
  const pendingClass = pending ? ' pending' : '';
  const animClass = (!pending && animate) ? ' animate-in' : '';
  const delay = (!pending && animate) ? ` style="animation-delay:${i * CARD_STAGGER}ms"` : '';
  return `<button class="module-card${animClass}${cs}${pendingClass}"${delay} data-module-slug="${m.slug}" data-module-name="${esc(name)}">
    <div class="module-icon">${icon(m.icon)}</div>
    <div class="module-info">
      <h3>${esc(name)} ${badge}</h3>
      ${stats}
    </div>
    <span class="module-arrow">${ICON_ARROW}</span>
  </button>`;
}

/* per-lesson progress, shown as "answered/total" inside the course filter */
function lessonProgressMap() {
  const data = state.currentModule ? MODULE_DATA[state.currentModule.slug] : null;
  const map = new Map();
  if (!data) return map;
  const slug = state.currentModule.slug;
  data.questions.forEach(q => {
    const s = map.get(q.lesson) || { answered: 0, total: 0 };
    s.total++;
    if (state.checkedQuestions[slug + '-' + q._key]) s.answered++;
    map.set(q.lesson, s);
  });
  return map;
}

function refreshLessonMeta() {
  const root = $('ms-lesson');
  if (!root) return;
  const map = lessonProgressMap();
  root.querySelectorAll('.ms-option').forEach(opt => {
    const meta = opt.querySelector('.ms-meta');
    if (!meta) return;
    const s = map.get(opt.dataset.value);
    meta.textContent = s ? `${s.answered}/${s.total}` : '';
  });
}

function rebuildFilterOptions() {
  const data = MODULE_DATA[state.currentModule.slug];
  const buildKey = state.currentModule.slug + '|' + state.lang + '|' + data.signature;
  if (filtersBuiltFor === buildKey && msLesson) return;
  filtersBuiltFor = buildKey;

  $('sort-year').innerHTML =
    `<option value="desc">${t('sortYearDesc')}</option>` +
    `<option value="asc">${t('sortYearAsc')}</option>`;
  $('sort-year').value = state.sortYear;

  const yearVals = [...new Set(data.questions.map(q => q.year))].sort((a, b) => b - a);
  msYear = createMultiselect($('ms-year'), {
    stateKey: 'filterYear',
    allLabel: t('filterExam'),
    pluralLabel: state.lang === 'fr' ? 'années' : 'years',
    items: yearVals.map(y => ({ value: y, label: String(y) })),
    parseValue: v => +v
  });

  const showRot = shouldShowRotation(state.selectedYear, state.currentModule.slug);
  $('ms-rot').style.display = showRot ? '' : 'none';
  if (showRot) {
    const rotVals = [...new Set(data.questions.map(q => q.rot || 0))].sort((a, b) => a - b);
    msRot = createMultiselect($('ms-rot'), {
      stateKey: 'filterRot',
      allLabel: t('filterRot'),
      pluralLabel: 'rotations',
      items: rotVals.map(r => ({ value: r, label: rotName(r) })),
      parseValue: v => +v
    });
  } else {
    state.filterRot = [];
    $('ms-rot').innerHTML = '';
    msRot = null;
  }

  const showUnit = shouldShowUnit(state.currentModule.slug);
  $('ms-unit').style.display = showUnit ? '' : 'none';
  if (showUnit) {
    const unitVals = [...new Set(data.questions.map(q => q.unit).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base', numeric: true }));
    msUnit = createMultiselect($('ms-unit'), {
      stateKey: 'filterUnit',
      allLabel: t('filterUnit'),
      pluralLabel: t('filterUnitPlural'),
      items: unitVals.map(u => ({ value: u, label: u })),
      parseValue: v => v
    });
  } else {
    state.filterUnit = [];
    $('ms-unit').innerHTML = '';
    msUnit = null;
  }

  const lessonMap = lessonProgressMap();
  const lessonVals = sortLessons([...new Set(data.questions.map(q => q.lesson))]);
  msLesson = createMultiselect($('ms-lesson'), {
    stateKey: 'filterLesson',
    allLabel: t('filterLesson'),
    pluralLabel: state.lang === 'fr' ? 'cours' : 'courses',
    items: lessonVals.map(l => {
      const s = lessonMap.get(l);
      return { value: l, label: l, meta: s ? `${s.answered}/${s.total}` : '' };
    }),
    parseValue: v => v,
    onOpen: refreshLessonMeta
  });
}

function renderModuleBody(preserveVisibleCount = false) {
  const w = $('module-welcome');
  if (state.modulePhase === 'welcome') {
    w.style.display = '';
    $('questions-container').innerHTML = '';
    $('empty').style.display = 'none';
    $('load-more-wrap').style.display = 'none';
    $('result-count').innerHTML = '';
    const data = MODULE_DATA[state.currentModule.slug];
    $('module-welcome-title').textContent = t('welcomeTitle');
    $('module-welcome-sub').textContent = t('welcomeSub')(data.questions.length);
  } else {
    w.style.display = 'none';
    renderQuestions(!preserveVisibleCount);
  }
}

function onFilterChange() {
  const wasWelcome = state.modulePhase === 'welcome';
  state.modulePhase = 'results';
  state.visibleCount = PAGE_SIZE;
  renderModuleBody();
  if (wasWelcome && window.scrollY > 120) {
    window.scrollTo({ top: 0, behavior: smoothBehavior() });
  }
}

/* ── welcome-screen shortcuts ── */
/* Shows the whole module from the first question, still 20 at a time: the
   "Afficher plus" button at the bottom loads the next page. */
function showAllQuestions() {
  if (!state.currentModule) return;
  state.filterMistakes = false;

  renderModuleBody();

/* Picks a random question and filters on its dimensions: year, rotation (when the
   module has that filter) and course. The drawn question is always part of the
   result, so the slice can never be empty. */
function randomizeFilters() {
  const data = currentModuleData();
  if (!data || !state.currentModule || !data.questions.length) return;

  const showRot = shouldShowRotation(state.selectedYear, state.currentModule.slug);
  const seed = data.questions[Math.floor(Math.random() * data.questions.length)];

  state.filterYear = [seed.year];
  state.filterRot = showRot ? [seed.rot || 0] : [];
  state.filterUnit = [];
  state.filterLesson = [seed.lesson];
  state.filterMistakes = false;

  msYear?.refresh();
  msRot?.refresh();
  msUnit?.refresh();
  msLesson?.refresh();

  state.modulePhase = 'results';
  state.visibleCount = PAGE_SIZE;
  renderModuleBody();
  updateMistakesButton();
  updateBarVisibility();
}

function getFilteredQuestions() {
  if (!state.currentModule) return [];
  const data = MODULE_DATA[state.currentModule.slug];
  const slug = state.currentModule.slug;
  const search = fold(state.filterSearch.trim());
  const out = [];
  /* filter first, copy only the survivors: no full-array clone per keystroke */
  for (let idx = 0; idx < data.questions.length; idx++) {
    const q = data.questions[idx];
    if (state.exam && !state.exam.rows.has(idx)) continue;
    if (state.filterYear.length && !state.filterYear.includes(q.year)) continue;
    if (state.filterRot.length && !state.filterRot.includes(q.rot || 0)) continue;
    if (state.filterUnit.length && !state.filterUnit.includes(q.unit || '')) continue;
    if (state.filterLesson.length && !state.filterLesson.includes(q.lesson)) continue;
    if (search && !q._hay.includes(search)) continue;
    if (state.filterMistakes) {
      const qid = slug + '-' + q._key;
      if (!state.checkedQuestions[qid]) continue;
      if (classifyAnswer(state.userAnswers[qid], q.answer.split('')) === 'correct') continue;
    }
    out.push({ ...q, _idx: idx });
  }
  if (state.exam) {
    const order = state.exam.order;
    return out.sort((a, b) => (order.get(a._idx) || 0) - (order.get(b._idx) || 0));
  }
  return out.sort(compareQuestions);
}

function compareQuestions(a, b) {
  const yearCmp = state.sortYear === 'asc' ? a.year - b.year : b.year - a.year;
  if (yearCmp !== 0) return yearCmp;
  /* courses are always listed A→Z (TD/Sim/TP last); the order is stable, the
     invert control was removed */
  const lessonCmp = lessonCompare(a.lesson, b.lesson);
  return lessonCmp !== 0 ? lessonCmp : a._idx - b._idx;
}

function renderQuestions(reset, append = false) {
  if (state.modulePhase !== 'results') return;
  const list = getFilteredQuestions();
  if (reset) state.visibleCount = PAGE_SIZE;
  const n = list.length;
  $('result-count').innerHTML = `<b>${n}</b> ${n > 1 ? t('resultsPlural') : t('results')}`;

  if (!n) {
    $('questions-container').innerHTML = '';
    $('empty-title').textContent = state.filterMistakes ? t('myMistakesTitle') : t('emptyTitle');
    $('empty-sub').textContent = state.filterMistakes ? t('myMistakesSub') : t('emptySub');
    $('empty').style.display = 'block';
    $('load-more-wrap').style.display = 'none';
    return;
  }
  $('empty-title').textContent = t('emptyTitle');
  $('empty-sub').textContent = t('emptySub');
  $('empty').style.display = 'none';
  renderVisibleQuestions(list, append);
}

function renderVisibleQuestions(list, append = false) {
  const container = $('questions-container');
  const visible = list.slice(0, state.visibleCount);
  const start = append ? Math.max(0, state.visibleCount - PAGE_SIZE) : 0;

  const html = visible.slice(start).map((q, i) => {
    const idx = start + i;
    const qid = qidFor(state.currentModule.slug, q);
    return `<div class="q-card" data-qid="${qid}" data-idx="${q._idx}" data-pos="${idx}">${renderQuestionCard(q, idx, qid)}</div>`;
  }).join('');

  if (append) container.insertAdjacentHTML('beforeend', html);
  else        container.innerHTML = html;

  updateLoadMoreButton(list.length);
}

function updateLoadMoreButton(total) {
  const remaining = total - state.visibleCount;
  if (remaining > 0) {
    $('load-more-wrap').style.display = 'block';
    $('btn-load-more').textContent = `${t('loadMore')} (${t('loadMoreRemaining')(remaining)})`;
  } else {
    $('load-more-wrap').style.display = 'none';
  }
}

function renderQuestionCard(q, idx, qid) {
  const isChecked = !!state.checkedQuestions[qid];
  const uAns = state.userAnswers[qid] || new Set();
  const correctAns = q.answer.split('').filter(c => LETTERS.includes(c));
  const result = isChecked ? classifyAnswer(uAns, correctAns) : null;
  const showRot = shouldShowRotation(state.selectedYear, state.currentModule.slug);
  const showUnit = shouldShowUnit(state.currentModule.slug);

  const opts = q.options.map((c, j) => {
    const L = LETTERS[j];
    const isSel = uAns.has(L);
    const isCor = correctAns.includes(L);
    let cls = 'opt';
    let mark = '';
    let sr = '';
    if (isChecked) {
      if (isCor && isSel) { cls += ' correct'; mark = '<span class="check" aria-hidden="true">✓</span>'; }
      else if (isCor && !isSel && result === 'partial') { cls += ' partial'; mark = '<span class="half" aria-hidden="true">◐</span>'; }
      else if (isCor && !isSel) {
        /* right answer, not picked: shown as "missed", never as a tick the user earned */
        cls += ' missed';
        mark = '<span class="missed-mark" aria-hidden="true">✓</span>';
        sr = `<span class="sr-only">(${esc(t('expectedAnswer'))})</span>`;
      }
      else if (!isCor && isSel) { cls += ' incorrect'; mark = '<span class="cross" aria-hidden="true">✕</span>'; }
    } else if (isSel) cls += ' selected';
    return `<button class="${cls}" data-opt-qid="${qid}" data-letter="${L}" aria-pressed="${isSel}" ${isChecked ? 'disabled' : ''}>
      <span class="letter">${L}</span>
      <span class="text">${richText(c)}${sr}</span>${mark}
    </button>`;
  }).join('');

  let feedback = '';
  if (isChecked) {
    const label = result === 'correct' ? t('correct') : result === 'partial' ? t('partial') : t('incorrect');
    feedback = `<div class="feedback show ${result}"><span class="dot"></span>${label}</div>`;
  }
  const clearStyle = (!isChecked && uAns.size === 0) ? 'style="display:none"' : '';

  const reportHref = reportUrl(q);

  return `<div class="q-head">
      <div class="q-meta">
        <span class="tag tag-year">${q.year}</span>
        ${showRot ? `<span class="tag tag-rot">${rotName(q.rot || 0)}</span>` : ''}
        ${showUnit && q.unit ? `<span class="tag tag-unit">${esc(q.unit)}</span>` : ''}
        <span class="tag tag-lesson">${esc(q.lesson)}</span>
      </div>
      <div class="q-head-right">
        <button class="q-link" type="button" data-link-qid="${qid}" title="${esc(t('copyLink'))}" aria-label="${esc(t('copyLink'))}">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
        <a class="q-report" href="${reportHref}" target="_blank" rel="noopener noreferrer" title="${esc(t('reportError'))}" aria-label="${esc(t('reportError'))}">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        </a>
        <span class="q-index">${String(idx + 1).padStart(2, '0')}</span>
      </div>
    </div>
    <div class="q-text">${richText(q.text)}</div>
    <div class="options">${opts}</div>
    <div class="q-footer">
      <div class="action-btns">
        <button class="validate-btn" data-validate-qid="${qid}" ${isChecked || uAns.size === 0 ? 'disabled' : ''}>${t('verify')}</button>
        <button class="clear-btn" data-clear-qid="${qid}" ${clearStyle}>${t('clear')}</button>
      </div>
      ${feedback}
    </div>`;
}

function classifyAnswer(userSet, correctAns) {
  if (!userSet || userSet.size === 0) return 'incorrect';
  const allSelCorrect = [...userSet].every(x => correctAns.includes(x));
  if (!allSelCorrect) return 'incorrect';
  if (userSet.size === correctAns.length) return 'correct';
  return 'partial';
}

/* A question can legitimately appear in several rows (one per exam session), so
   every card sharing its content key is refreshed together. */
function updateCard(qid) {
  const cards = document.querySelectorAll(`.q-card[data-qid="${CSS.escape(qid)}"]`);
  if (!cards.length) return;
  const questions = MODULE_DATA[state.currentModule.slug].questions;

  /* remember what had keyboard focus so it survives the innerHTML swap */
  const ae = document.activeElement;
  let activeCard = null;
  let prefs = null;
  cards.forEach(card => {
    if (!ae || !card.contains(ae)) return;
    activeCard = card;
    if (ae.dataset && ae.dataset.letter) prefs = ['[data-letter="' + ae.dataset.letter + '"]', '.opt:not(:disabled)'];
    else if (ae.hasAttribute('data-validate-qid')) prefs = ['[data-validate-qid]', '.clear-btn', '.opt:not(:disabled)'];
    else if (ae.hasAttribute('data-clear-qid')) prefs = ['.opt:not(:disabled)'];
  });

  cards.forEach(card => {
    const q = questions[+card.dataset.idx];
    if (!q) return;
    card.innerHTML = renderQuestionCard(q, +card.dataset.pos, qid);
  });

  if (activeCard && prefs) {
    for (const sel of prefs) {
      const el = activeCard.querySelector(sel);
      if (el && !el.disabled && el.offsetParent !== null) { el.focus({ preventScroll: true }); break; }
    }
  }
}

function announce(msg) {
  const el = $('sr-status');
  if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 50);
}

function announceResult(qid) {
  const card = document.querySelector(`.q-card[data-qid="${CSS.escape(qid)}"]`);
  if (!card) return;
  const q = MODULE_DATA[state.currentModule.slug].questions[+card.dataset.idx];
  if (!q) return;
  const res = classifyAnswer(state.userAnswers[qid], q.answer.split(''));
  announce(`${t('qLabel')} ${+card.dataset.pos + 1} · ${t(res)}`);
}

    renderModuleView(true);

function goBackFromModule() {

     not on the semester picker it was never opened from */
  if (state.selectedYear === 1 && m) {

  state.visibleCount = PAGE_SIZE;
